<!DOCTYPE html>
<!--
【01 声調キャッチ（声調リズム）】 設計メモ（合成版：Grok Bot 版を土台に、各AI版の検証済みの長所を統合）
■学習目標：先生の声（合成）を聞いて、語の「すべての音節」の声調（1〜4声・軽声）を聞き分ける。
  日本語は高低アクセントで、音節ごとに上がり下がりを聞き分ける習慣がない。特に 2声と3声、1声と4声の混同が多いので、
  音節ごとに答えさせ、結果画面で「どの声調をどれと取り違えたか」を見せる（自分の弱点が分かる）。
■一局：10問・約3〜4分。音声を聞く → 音節ごとに声調ボタンを押す → 「答え合わせ」→ 正誤と正しいピンイン → 次へ。
■画面：タイトル（レベル選択・これまでの声調別正答率）→ ゲーム中（漢字・声調記号を外したピンイン・意味）
  → 答え合わせ（音節ごとに ○×、正しい声調記号、もう一度聞く）→ 結果（音節正答率、声調別正答率、取り違えトップ3）
  → 復習（まちがえた語の一覧と音声、「まちがえた語だけもう一度」）。
■素材：sample_words.json の40語と audio（完全URL）をそのまま使用。声調の正解は教材のピンイン表記から自動計算（変更なし）。
  新しく書いた内容：画面の説明文、変調の説明（不 bú・多少）→ ⚠先生確認。
■難度：①1音節（1〜4声）②2音節（軽声なし）③軽声・変調を含む語と3音節語。軽声ボタンは②③に常に出す（答えに軽声がある時だけ出すと答えが分かるため）。
■スマホ・iPhone：最初の「スタート」タップで音声を解錠し、以後は同じ Audio を使い回す。消音スイッチONだと聞こえない旨を表示。
  ボタンは高さ52px以上。LINE/Teams 内ブラウザでも localStorage が使えない場合は記録だけ保存されない（遊べる）。
■効果の確かめ方：毎回の声調別正答率を端末に保存。授業前後に③を1回ずつやって比較／2声↔3声の取り違え回数の推移を見る。
■リスク：合成音声の声調が聞き取りにくい語があり得る（先生の確認が必要）。教材表記どおりに判定するため、
  多少（duōshǎo／会話では duōshao）、不客气（bú＝変調後の表記）は表記に従う。真機・LINE内での自動再生は未検証。
■前端レビュー後：声調ボタンの文字を16pxに。音声が出ないときは画面に日本語で知らせる（ピンインは答えになるので出さない）。
■前端レビュー後：前回の局で出た語は次の局で後回しにする。
■合成版（2026-10-26）：網頁版 Claude 01 の「答え合わせ後に五度標記の線を描き、まちがえた声調を点線で重ねる」を移植。
-->
<html lang="ja" data-game="01-tone">
<head>

<style>:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--sub:#666;--line:#d9d4c7;--pri:#2f5d8a;--pri2:#e8f0f8;--ok:#1f7a4d;--okbg:#e5f5ec;--ng:#b3261e;--ngbg:#fde9e7;--warn:#8a5a00;--warnbg:#fff4d6;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",Meiryo,sans-serif;padding:0 0 calc(var(--fh,56px) + 12px)}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
header.top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--pri);color:#fff;position:sticky;top:0;z-index:5}

.py{display:block;font-size:16px;color:#355;letter-spacing:.02em}

.fb{border-radius:12px;padding:12px;margin:10px 0;font-size:15px}
.fb.ok{background:var(--okbg);border:1px solid #9fd3b6}.fb.ng{background:var(--ngbg);border:1px solid #efb1ab}
.fb.info{background:var(--pri2);border:1px solid #bcd}
.audio{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:48px;min-height:48px;padding:6px 12px;border-radius:24px;border:1px solid var(--pri);background:#fff;color:var(--pri);font-size:15px;font-weight:600}
footer.note{position:fixed;left:0;right:0;bottom:0;background:#fffdf8;border-top:1px solid var(--line);font-size:14px;line-height:1.45;color:#555;padding:6px 10px calc(6px + env(safe-area-inset-bottom));text-align:center;z-index:6}
#astat{min-height:0;font-size:15px;color:var(--ng)}
.bar{height:8px;background:#e7e2d6;border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri);width:0;transition:width .2s}
table.t{width:100%;border-collapse:collapse;font-size:15px}table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.tag{display:inline-block;font-size:14px;border-radius:6px;padding:0 6px;background:#eee;color:#444}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.center{text-align:center}.mt0{margin-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.seg button{flex:1;min-width:90px;min-height:48px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:16px}
.seg button[aria-pressed=true]{border-color:var(--pri);background:var(--pri2);color:var(--pri);font-weight:700}
details{margin:8px 0}summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--pri);font-weight:600}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}

/* 答えたあとの大事なボタンを、スマホの画面下に固定して親指で押せるようにする（下の説明欄の上に出る） */
.stick{position:sticky;bottom:calc(var(--fh,56px) + 6px);z-index:4;box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.stickbar{position:sticky;bottom:calc(var(--fh,56px));z-index:4;background:linear-gradient(rgba(246,244,239,0),var(--bg) 30%);padding:10px 0 2px;margin:0 -2px}
.stickbar .btn{margin:4px 0}
.py.hid{display:none}body.showpy .py.hid{display:block}

.btn,.fb{scroll-margin-bottom:calc(var(--fh,56px) + 14px);scroll-margin-top:64px}

.word{text-align:center;padding:6px 0}
/* 答え合わせ後の曲線＋ラベルがあっても、3音節まで常に1行（折り返さない） */
.slots{display:flex;justify-content:center;gap:6px;margin:10px 0;flex-wrap:nowrap}
.slot{flex:0 1 112px;min-width:0;padding:6px 4px;border:2px dashed var(--line);border-radius:12px;text-align:center;background:#fff}
.slot.cur{border-color:var(--pri);border-style:solid}
.cv{display:block;margin:4px auto 0}.cv .gl{stroke:#d9d4c7;stroke-width:1}.cv .c{stroke:#1f7a4d;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;fill:none}.cv circle.c{fill:#1f7a4d;stroke:none}.cv .cu{stroke:#b3261e;stroke-width:2.6;stroke-dasharray:3 3.5;stroke-linecap:round;fill:none}.cv circle.cu{fill:none;stroke:#b3261e;stroke-width:2}

.lg{display:block;font-size:14px;line-height:1.3;font-weight:700;margin-top:2px}
.lg i{display:inline-block;width:12px;height:0;vertical-align:middle;margin-right:3px;border-top:3px solid}
.lg.c{color:#1f7a4d}.lg.c i{border-top-color:#1f7a4d}.lg.cu{color:#b3261e}.lg.cu i{border-top:3px dotted #b3261e}
.slot .s{font-size:18px;font-family:inherit}.slot .t{font-size:22px;min-height:30px;font-weight:700;color:var(--pri)}
.slot.ok{border:2px solid var(--ok);background:var(--okbg)}.slot.ng{border:2px solid var(--ng);background:var(--ngbg)}

.tb svg{display:block;margin:0 auto 2px}
.tb:active{background:var(--pri2)}
#qja{font-size:16px}
</style>
</head>
<body>
<header class="top"><a class="home" href="../index.html" aria-label="目次にもどる">← 目次</a><h1>声調キャッチ</h1><span class="hud" id="hud"></span></header>
<main class="wrap">
<section class="screen on" id="title">
  <div class="card">
    <h2>音を聞いて、声調を当てよう</h2>
    <p>先生の声（合成）を聞いて、<b>音節ごとに</b>声調ボタンを押します。1回10問・約3分。</p>
    <p class="small">iPhone は消音スイッチがオンだと音が出ません。イヤホン推奨。</p>
  </div>
  <div class="card">
    <h3 class="mt0">レベル</h3>
    <div class="seg" id="lv">
      <button type="button" data-lv="1" aria-pressed="true">① 1音節</button>
      <button type="button" data-lv="2" aria-pressed="false">② 2音節</button>
      <button type="button" data-lv="3" aria-pressed="false">③ 軽声・3音節</button>
    </div>
    <p class="small" id="lvdesc"></p>
    <button class="btn" id="go" type="button">スタート</button>
  </div>
  <div class="card" id="hist"></div>
</section>

<section class="screen" id="play">
  <div class="bar"><i id="prog"></i></div>
  <div class="card word">
    <div id="qhz"></div>
    <div class="sub" id="qja"></div>
    <div style="margin-top:8px"><button class="audio" id="replay" type="button">▶ もう一度聞く</button></div>
    <div id="astat"></div>
    <div class="slots" id="slots"></div>
    <p class="legend" id="lgd" hidden>線＝音の高さ（上ほど高い）</p>
  </div>
  <div id="pad"></div>
  <div class="row"><button class="btn ghost" id="undo" type="button">1つ消す</button><button class="btn" id="check" type="button" disabled>答え合わせ</button></div>
  <div id="fb"></div>
  <button class="btn" id="next" type="button" style="display:none">次へ</button>
</section>

<section class="screen" id="result">
  <div class="card center"><h2>結果</h2><div id="score"></div></div>
  <div class="card" id="bytone"></div>
  <div class="card" id="confuse"></div>
  <button class="btn" id="toReview" type="button">復習する</button>
  <button class="btn ghost" id="again" type="button">もう一度（同じレベル）</button>
  <button class="btn ghost" id="toTitle" type="button">タイトルへ</button>
</section>

<section class="screen" id="review">
  <div class="card"><h2>復習：まちがえた語</h2><div id="rlist"></div></div>
  <button class="btn" id="retryMiss" type="button">まちがえた語だけもう一度</button>
  <button class="btn ghost" id="toTitle2" type="button">タイトルへ</button>
</section>
</main>
<footer class="note">音声：先生の声をもとに合成 ／ ⚠先生確認：説明文は新しく書いたものです</footer>
<script>
'use strict';
/* 共通部品（各ファイルに同じものを埋め込み。外部ライブラリなし） */
const G = (() => {
  const GAME = document.documentElement.dataset.game || 'x';

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;

  { const ap = Element.prototype.append; Element.prototype.append = function (...a) { return ap.apply(this, a.filter(x => x != null && x !== false)); }; }
  let rnd = Math.random;
  function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function pick(a, n, r = rnd) { return shuffle(a, r).slice(0, n); }
  // ---- 保存（localStorage のみ。使えない環境でも遊べる） ----
  let mem = {};
  function load() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : {}; } catch (e) { return mem; } }
  function save(o) { mem = o; try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { } }
  // ---- 画面切り替え ----
  function show(id) { $$('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }
  // ---- タイマー（重ねがけ防止：新しい回の前に必ず clearAll） ----
  const T = new Set();
  function after(ms, fn) { const id = setTimeout(() => { T.delete(id); fn(); }, ms); T.add(id); return id; }
  function every(ms, fn) { const id = setInterval(fn, ms); T.add(-id); return id; }
  function clearAll() { for (const id of T) { if (id < 0) clearInterval(-id); else clearTimeout(id); } T.clear(); }
  // ---- 音声（1つの Audio を使い回す。失敗は画面内に表示、alert は使わない） ----
  const au = new Audio(); au.preload = 'auto';
  let playSeq = 0;
  function play(url) {
    const seq = ++playSeq; const st = $('#astat');
    if (st) st.textContent = '';
    return new Promise(res => {
      if (!url) return res(false);
      try { au.pause(); } catch (e) { }
      au.onended = () => { if (seq === playSeq) res(true); };
      au.onerror = () => { if (seq === playSeq) { if (st) st.textContent = '音声を再生できませんでした。通信状況を確認して、もう一度押してください。'; fail(url); res(false); } };
      au.src = url;
      const p = au.play();
      if (p && p.catch) p.catch(err => { if (seq !== playSeq) return; if (err && err.name === 'AbortError') return; if (st) st.textContent = '音声を再生できませんでした（' + (err && err.name === 'NotAllowedError' ? 'もう一度ボタンを押してください' : '通信状況を確認してください') + '）。'; fail(url); res(false); });
    });
  }
  // 再生できなかったことを各ゲームに知らせる（時間制のゲームはタイマーを止めて、文字のヒントを出す）
  function fail(url) { try { window.dispatchEvent(new CustomEvent('audiofail', { detail: url })); } catch (e) { } }

  // ---- 表示部品 ----
  const zh = (t, cls = '') => h('span', { class: 'zh ' + cls, lang: 'zh-CN' }, t);
  const py = t => h('span', { class: 'py', lang: 'zh-Latn-pinyin' }, t);
  const ja = t => h('span', { class: 'ja' }, t);
  // 中級・上級用：ピンインは最初は隠しておき、「ピンイン」ボタンで出せる（中国語には必ずピンインが付いている状態にする）
  const pyh = t => h('span', { class: 'py hid', lang: 'zh-Latn-pinyin' }, t);
  function pyBtn() { const b = h('button', { class: 'btn inline ghost pybtn', type: 'button', 'aria-pressed': String(document.body.classList.contains('showpy')) }, document.body.classList.contains('showpy') ? 'ピンインを隠す' : 'ピンインを表示'); b.onclick = () => { const on = document.body.classList.toggle('showpy'); $$('.pybtn').forEach(x => { x.textContent = on ? 'ピンインを隠す' : 'ピンインを表示'; x.setAttribute('aria-pressed', String(on)); }); }; return b; }
  const chk = () => h('span', { class: 'chk' }, '⚠先生確認');
  const kb = t => h('span', { class: 'kb' }, t);
  function plain(p) { return p.normalize('NFD').replace(/[\u0300-\u0304\u0306\u0307\u0309-\u036f]/g, '').normalize('NFC'); }
  let toastT = 0;
  function toast(m) { let t = $('.toast'); if (!t) { t = h('div', { class: 'toast', role: 'status' }); document.body.append(t); } t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }
  // ---- 連打対策：1問につき1回だけ受け付ける ----
  function guard() { let used = false; const born = performance.now(); return fn => (...a) => { if (used || performance.now() - born < 300) return; used = true; fn(...a); }; } // 表示直後0.3秒のタップは前の画面の連打とみなして無視
  function lock(box) { $$('button', box).forEach(b => b.disabled = true); }
  const today = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  // ---- 連打対策：前のタップの時点で見えていなかった要素への 0.35 秒以内のタップは無視（画面が変わった直後の指の2回目） ----
  let lastTap = -1e9, seenVis = new WeakMap();

    const shown = res ? s[0] : G.plain(s[0]).toLowerCase();
    const t = input[i];
    const el = G.h('div', { class: 'slot' + (res ? (res[i] ? ' ok' : ' ng') : (i === input.length ? ' cur' : '')) },
      G.h('div', { class: 's', lang: 'zh-Latn-pinyin' }, shown),
      G.h('div', { class: 't' }, t == null ? '？' : (res ? (res[i] ? '○' : '×') : TONE_NAME[t])),
      // 答え合わせ後：曲線のすぐ下に凡例。緑の実線＝正解の声調、赤い点線＝自分の答え（まちがえたときだけ）
      res ? G.h('div', { html: contour(s[1], i ? w.syl[i - 1][1] : 0, t) }) : null,
      res ? G.h('span', { class: 'lg c' }, G.h('i', {}), '正解 ' + TONE_NAME[s[1]]) : null,
      res && !res[i] ? G.h('span', { class: 'lg cu' }, G.h('i', {}), 'あなた ' + TONE_NAME[t]) : null);
    box.append(el);
  });
}
function renderPad() {
  const pad = G.$('#pad'); pad.innerHTML = '';
  const tones = lv === 1 ? [1, 2, 3, 4] : [1, 2, 3, 4, 0];
  const g = G.h('div', { class: 'tones' + (lv === 1 ? ' four' : '') });
  tones.forEach(t => g.append(G.h('button', { class: 'tb', type: 'button', 'data-tone': t, 'aria-label': TONE_NAME[t], html: icon(t) + TONE_NAME[t], onclick: () => tap(t) })));
  pad.append(g);
}
function tap(t) {
  if (answered) return; const w = qs[qi];
  if (input.length >= w.syl.length) return;
  input.push(t); renderSlots();
  G.$('#check').disabled = input.length < w.syl.length;
}
G.$('#undo').onclick = () => { if (answered) return; input.pop(); renderSlots(); G.$('#check').disabled = true; };
G.$('#replay').onclick = () => G.play(qs[qi].audio);
G.$('#check').onclick = () => {
  if (answered) return; const w = qs[qi]; if (input.length < w.syl.length) return;
  answered = true; G.lock(G.$('#pad')); G.$('#check').disabled = true; G.$('#undo').disabled = true;
  const res = w.syl.map((s, i) => s[1] === input[i]);
  w.syl.forEach((s, i) => { st.tone.n[s[1]]++; if (res[i]) st.tone.ok[s[1]]++; });
  log.push({ w, input: input.slice(), res });
  renderSlots(res);
  const all = res.every(Boolean);
  const fb = G.h('div', { class: 'fb ' + (all ? 'ok' : 'ng') },
    G.h('b', {}, all ? '正解！' : '不正解'), ' 正しくは ', G.h('span', { lang: 'zh-Latn-pinyin', style: 'font-size:18px;font-weight:700' }, w.pinyin),
    '（' + w.syl.map(s => TONE_NAME[s[1]]).join('・') + '）',
    NOTE[w.hanzi] ? G.h('p', { class: 'small' }, NOTE[w.hanzi]) : null);
  G.$('#fb').append(fb); G.$('#lgd').hidden = false;
  if (!all) G.play(w.audio);
  G.save(st);
  const nx = G.$('#next'); nx.textContent = qi + 1 < qs.length ? '次へ' : '結果を見る'; nx.style.display = 'block'; nx.disabled = false; G.reveal(nx); // 前端共通指摘：答えたあと「次へ」を画面内に
};
G.$('#next').onclick = () => { const nx = G.$('#next'); if (nx.disabled) return; nx.disabled = true; nx.style.display = 'none'; qi++; if (qi < qs.length) ask(); else finish(); };
function finish() {
  G.clearAll(); G.$('#hud').textContent = ''; G.$('#prog').style.width = '100%';
  let n = 0, ok = 0; const by = {}, conf = {};
  log.forEach(l => l.w.syl.forEach((s, i) => { n++; if (l.res[i]) ok++; const k = s[1]; by[k] = by[k] || [0, 0]; by[k][0]++; if (l.res[i]) by[k][1]++; else { const key = TONE_NAME[k] + ' → ' + TONE_NAME[l.input[i]]; conf[key] = (conf[key] || 0) + 1; } }));
  const words = log.filter(l => l.res.every(Boolean)).length;
  const pct = Math.round(100 * ok / n);
  const prev = st.best[lv] || 0; if (pct > prev) st.best[lv] = pct; G.save(st);
  G.$('#score').innerHTML = '';
  G.$('#score').append(G.h('p', { style: 'font-size:30px;font-weight:700;margin:0' }, `${words} / ${log.length} 語`), G.h('p', {}, `音節の正答率 ${pct}%（${ok}/${n}）`), G.h('p', { class: 'small' }, prev ? `このレベルの自己ベスト ${Math.max(prev, pct)}%` : '初めての記録です'));
  const bt = G.$('#bytone'); bt.innerHTML = ''; bt.append(G.h('h3', { class: 'mt0' }, '声調別（今回）'));
  const tb = G.h('table', { class: 't' }); [1, 2, 3, 4, 0].forEach(k => { if (by[k]) tb.append(G.h('tr', {}, G.h('td', { html: icon(k) }), G.h('td', {}, TONE_NAME[k]), G.h('td', {}, `${by[k][1]}/${by[k][0]}`))); }); bt.append(tb);
  const cf = G.$('#confuse'); cf.innerHTML = ''; cf.append(G.h('h3', { class: 'mt0' }, '取り違えやすい組み合わせ'));
  const top = Object.entries(conf).sort((a, b) => b[1] - a[1]).slice(0, 3);
  cf.append(top.length ? G.h('ul', {}, top.map(([k, v]) => G.h('li', {}, `${k}（${v}回）`))) : G.h('p', {}, '取り違えはありませんでした。'));
  if (top.length && /2声 → 3声|3声 → 2声/.test(top[0][0])) cf.append(G.h('p', { class: 'small' }, '2声は「下から上へ」、3声は「低くおさえる」。⚠先生確認'));
  G.show('result');
}
function renderReview() {
  const box = G.$('#rlist'); box.innerHTML = '';
  const miss = log.filter(l => !l.res.every(Boolean));
  if (!miss.length) box.append(G.h('p', {}, '全問正解です。'));
  miss.forEach(l => box.append(G.h('div', { class: 'card' }, G.zh(l.w.hanzi, 'mid'), ' ', G.h('b', { lang: 'zh-Latn-pinyin' }, l.w.pinyin), G.h('span', { class: 'ja' }, l.w.ja + ' ／ あなたの答え：' + l.input.map(t => TONE_NAME[t]).join('・')), G.audioBtn(l.w.audio))));
  G.$('#retryMiss').style.display = miss.length ? 'block' : 'none';
}
G.$('#go').onclick = () => start();
G.$('#again').onclick = () => start();
G.$('#toReview').onclick = () => { renderReview(); G.show('review'); };
G.$('#retryMiss').onclick = () => start(log.filter(l => !l.res.every(Boolean)).map(l => l.w));
G.$('#toTitle').onclick = G.$('#toTitle2').onclick = () => { G.clearAll(); G.stopAudio(); renderHist(); G.show('title'); G.$('#hud').textContent = ''; };
setLv(1); renderHist();
if (G.test) window.__t = { answer: () => qs[qi].syl.map(s => s[1]), level: setLv };
</script>
