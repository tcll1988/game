<!DOCTYPE html>
<!--
【11 リピート＆シャドーイング（跟读）】 設計メモ（合成版：Grok Bot 版を土台に、各AI版の検証済みの長所を統合）
■学習目標：教科書の会話（第10課）・読解（第11課）の文を、先生の音声のすぐ後に、同じくらいの速さで言えるようにする。
  日本の学生は「読めばわかる」が「口が追いつかない」ことが多い。音読の量を増やし、反応の速さと、お手本と比べた長さ（話す速さ）を数字で見せる。
■一局：1つのまとまり（6〜9文）・約3〜5分。1文ごとに「聞く→ピッ→言う」。
■画面：タイトル（まとまり・やり方を選ぶ）→ 練習（文・ピンイン・訳の表示切替、録音、反応と長さの判定、声の波形の比較）→ 結果（文ごとの◎○△）。
■やり方：
  ・リピート（標準）：先生の音声が終わって「ピッ」と鳴ったら言う。スピーカーで聞いても先生の声が録音に混ざりにくい。
  ・シャドーイング（イヤホン推奨）：先生の音声を聞きながら、少し遅れて追いかけるように言う。
  ・マイクなし：言い始めにボタンを押し、言い終わったら離す（自己申告のタイミング練習）。
■判定（機械による目安）：反応＝合図（またはお手本の言い始め）から声が出るまでの時間。長さ＝自分の声の長さ÷お手本の声の長さ。
  発音の正しさは判定しない（声の大きさの変化だけを見る）。正しさは自分の録音を聞いて自己チェック。
■素材：教科書の文・ピンイン・訳・音声をそのまま使う（話者記号 A:/B: は表示のときだけ外して「A」「B」として示す）。新しい中国語はない。
  ⚠先生確認：判定の基準（反応1秒以内・長さ75〜140％を◎）が授業のねらいに合うか。
■難度：表示（ピンイン・訳）を消すほど難しい。シャドーイングはリピートより難しい。
■スマホ・iPhone：マイクは最初の録音ボタンで許可を求める。許可されないとき・LINE/Teams内ブラウザのときは日本語で手順を表示し、マイクなしモードへ案内。
  音声の再生と録音は同じ AudioContext を使い、タップのときに resume する。ページを離れるとマイクを止める。
■効果の確かめ方：文ごとの最高評価と回数を保存。結果画面で前回との比較（◎の数）。
■リスク：騒がしい教室では声の始まり・終わりの検出がずれる。スピーカーでシャドーイングすると先生の声が混ざる（イヤホンを案内）。
■前端レビュー後：マイクが使えないときは練習画面のまま説明と「マイクなしモードにする」を表示。マイクなしモードは指が少しずれても離すまで計測する。
-->

<main class="wrap">

<footer class="note">音声：先生の声をもとに合成 ／ 判定は機械による目安です（発音の正しさは判定しません） ／ ⚠先生確認：判定の基準</footer>
<script>
'use strict';
/* 共通部品（各ファイルに同じものを埋め込み。外部ライブラリなし） */

  // ---- 画面切り替え ----
  function show(id) { $$('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }
  // ---- タイマー（重ねがけ防止：新しい回の前に必ず clearAll） ----
  const T = new Set();
  function after(ms, fn) { const id = setTimeout(() => { T.delete(id); fn(); }, ms); T.add(id); return id; }

  const kb = t => h('span', { class: 'kb' }, t);
  function plain(p) { return p.normalize('NFD').replace(/[\u0300-\u0304\u0306\u0307\u0309-\u036f]/g, '').normalize('NFC'); }

  function toast(m) { let t = $('.toast'); if (!t) { t = h('div', { class: 'toast', role: 'status' }); document.body.append(t); } t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }
  // ---- 連打対策：1問につき1回だけ受け付ける ----
  function guard() { let used = false; const born = performance.now(); return fn => (...a) => { if (used || performance.now() - born < 300) return; used = true; fn(...a); }; } // 表示直後0.3秒のタップは前の画面の連打とみなして無視

  let lastTap = -1e9, seenVis = new WeakMap();

  // 声調の誤答選択肢に使わない声調（その字の別の正しい読み・変調形）。例：好 hào、和 hè、喝 hè、读 dù、不 bú/bù、都 dū、的 dí/dì

G.$('#listen').onclick = async () => { if (busy) return; await wake(); stopPlay(); try { const B = await getBuf(cur().audio); playBuf(B); } catch (e) { G.play(cur().audio); } };

function actClick() { if (mode !== 'hold') run(); else holdCue(); }
G.$('#act').onclick = actClick;

async function run() {

function holdCue() {
  if (busy) return; busy = true; const my = ++runId, act = G.$('#act'), msg = G.$('#pmsg'); act.disabled = true; G.$('#res').innerHTML = '';
  wake().then(() => getBuf(cur().audio)).then(async B => {
    if (my !== runId) return; msg.textContent = '聞いてください…'; await playBuf(B); if (my !== runId) return; await beep(); if (my !== runId) return;
    const mLen = (B.env.off || B.buf.duration) - (B.env.on || 0), tCue = performance.now(); let tDown = null;
    msg.textContent = '言い始めたら押して、言い終わったら離す'; act.disabled = false; act.textContent = '押しながら言う'; act.onclick = null;

    act.onpointerdown = down; act.onpointerup = up; act.onpointercancel = up; // 指が少しずれても離すまで計測（setPointerCapture）

  }).catch(() => { busy = false; act.disabled = false; G.$('#astat').textContent = '音声を読み込めませんでした。通信状況を確認して、もう一度押してください。'; });
}
function show_(onset, ratio, M, U, R) {

    G.h('div', { style: 'font-size:30px;font-weight:700' }, j.mark + ' ', G.h('span', { class: 'small' }, '（機械による目安）')),
    onset != null ? G.h('div', { class: 'meter' }, G.h('span', {}, '反応'), G.h('b', {}, onset.toFixed(1) + '秒'), G.h('span', { class: 'small' }, mode === 'sh' ? '目安 0.8秒以内' : '目安 1秒以内'),
      G.h('span', {}, '長さ'), G.h('b', {}, ratio == null ? '—' : Math.round(ratio * 100) + '％'), G.h('span', { class: 'small' }, 'お手本＝100％')) : null,

    const sc = G.h('div', { class: 'seg' }); const q = G.h('p', { class: 'small' }, '自分の声を聞いて：声調も文も、お手本と同じに言えた？');
    ['はい', 'まだ'].forEach(t => sc.append(G.h('button', { type: 'button', 'aria-pressed': 'false', onclick: e => { G.$$('button', sc).forEach(b => b.setAttribute('aria-pressed', String(b === e.currentTarget))); const L = log.find(l => l.i === qi); if (L) L.self = t; } }, t)));
    res.append(q, sc);

function finish() {

  sc.append(G.h('div', { style: 'font-size:34px;font-weight:700' }, '◎ ' + n3 + ' / ' + lines.length), G.h('p', { class: 'small' }, prev != null ? '前回（同じまとまり・やり方）：◎ ' + prev + (n3 > prev ? ' → 上がりました！' : '') : '初めての記録です。'));

    G.h('p', { class: 'small' }, '・LINE・Teams の中で開いた場合：右上（または下）の「…」→「ブラウザで開く」で Safari / Chrome で開いてください。'),
