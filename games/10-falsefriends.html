<!DOCTYPE html>
<!--
【10 日中 同形異義語クイズ（その漢字、日本語と同じ意味？）】 設計メモ（合成版：Grok Bot 版を土台に、各AI版の検証済みの長所を統合）
■学習目標：日本語と同じ漢字なのに意味が違う語（手纸・汽车・勉强・新闻・走…）を、例文の中で正しく理解する。
  日本の学生は「漢字が同じ＝意味も同じ」と思い込みやすい。逆に意味が同じ語（学校・电话…）もあるので、
  「いつも日本語の意味がまちがい」というパターン当てにならないよう、10問中3問前後は意味が同じ語を混ぜる。
■一局：10問・約3分。
■画面：タイトル（レベル）→ 問題（中国語の語＋ピンイン、4択の日本語の意味）→ 解説（中国語の意味／日本語の同じ漢字の意味／
  例文と訳／日本語の「〇〇」は中国語で何と言うか）→ 結果（点数・だまされた語）→ 復習・まちがえた語だけもう一度。
■素材：語・意味・例文・逆引き（日本語→中国語）はすべて新しく作成（⚠先生確認）。ただし 颜色・看病・走 の例文は
  教科書（第10課会話 h-18・第11課読解 h-5）の文をそのまま使い、教科書の音声も使う。40語にある語（工作・东西）は語の音声も使う。
■難度：初級＝中国語→日本語の意味（4択）　中級＝日本語の語（例：手紙）→中国語で何と言う？（4択。同じ漢字の語がわな）
■スマホ・iPhone：選択肢は縦1列、ボタン高さ56px以上。解説は短く、例文は折りたたまずに表示。
■効果の確かめ方：語ごとの正誤を保存し、タイトルに「だまされやすい語」上位を表示。
■リスク：意味の説明は簡略化している（例：老婆はくだけた言い方、先生は「〜さん」以外に「夫」の意味もある）。先生の確認が必要。
■前端レビュー後：意味が同じ語（学校・时间など）にも、それらしい「わな」の選択肢を用意し、どの問題も紛らわしい選択肢が2つある。同じ意味の語を毎回4〜5問入れ、「日本語と同じ字はいつもわな」という覚え方では当たらないようにした。中級は「ピンインを表示」。
■成品確認後：意味が重なる 丈夫・先生・爱人・老婆（夫・妻）は、おたがいの誤答にしない（CLASH）。
-->

// z, p, 中国語の意味, 日本語の同じ漢字の意味（同じ意味なら null）, 例文[zh,py,ja] または教科書, 逆引き[日本語の語, 中国語, ピンイン]（⚠先生確認）
const D = [

  ['告诉', 'gàosu', '知らせる・教える', '告訴（訴える）', ['请告诉我你的名字。', 'Qǐng gàosu wǒ nǐ de míngzi.', 'あなたの名前を教えてください。'], ['告訴', '起诉', 'qǐsù']],
  ['工作', 'gōngzuò', '仕事・働く', '工作（物を作ること・図工）', ['你在哪儿工作？', 'Nǐ zài nǎr gōngzuò?', 'あなたはどこで働いていますか。'], ['工作（こうさく）', '手工', 'shǒugōng']],
  ['汤', 'tāng', 'スープ', '湯（お湯）', ['这个汤很好喝。', 'Zhège tāng hěn hǎohē.', 'このスープはおいしい。'], ['お湯', '热水', 'rèshuǐ']],
  ['便宜', 'piányi', '（値段が）安い', '便宜（都合がよいこと）', ['这件衬衣很便宜。', 'Zhè jiàn chènyī hěn piányi.', 'このシャツは安い。'], ['便宜（べんぎ）', '方便', 'fāngbiàn']],
  ['颜色', 'yánsè', '色', '顔色（顔の色・きげん）', L('10k-h-18'), ['顔色', '脸色', 'liǎnsè']],
  ['看病', 'kànbìng', '診察を受ける・診察する', '看病（病人の世話をする）', L('d1-11k-h-5'), ['看病（かんびょう）', '照顾病人', 'zhàogù bìngrén']],
  ['结束', 'jiéshù', '終わる', '結束（団結）', ['课几点结束？', 'Kè jǐ diǎn jiéshù?', '授業は何時に終わりますか。'], ['結束', '团结', 'tuánjié']],
  ['先生', 'xiānsheng', '〜さん（男性）・夫', '先生（教師）', ['王先生，您好！', 'Wáng xiānsheng, nín hǎo!', '王さん、こんにちは。'], ['先生', '老师', 'lǎoshī']],
  ['去', 'qù', '行く', '去る（離れる）', ['我去学校。', 'Wǒ qù xuéxiào.', '私は学校へ行きます。'], ['去る', '离开', 'líkāi']],
  ['床', 'chuáng', 'ベッド', '床（ゆか）', ['我的床很小。', 'Wǒ de chuáng hěn xiǎo.', '私のベッドは小さい。'], ['床（ゆか）', '地板', 'dìbǎn']],
  ['怪我', 'guài wǒ', '私のせいだ', '怪我（けが）', ['都怪我。', 'Dōu guài wǒ.', '全部私のせいです。'], ['怪我（けが）', '受伤', 'shòushāng']],
  // 意味が同じ語
  ['学校', 'xuéxiào', '学校', null, ['我去学校。', 'Wǒ qù xuéxiào.', '私は学校へ行きます。'], ['学校', '学校', 'xuéxiào']],
  ['时间', 'shíjiān', '時間', null, ['我没有时间。', 'Wǒ méiyǒu shíjiān.', '私は時間がありません。'], ['時間', '时间', 'shíjiān']],
  ['电话', 'diànhuà', '電話', null, ['我给妈妈打电话。', 'Wǒ gěi māma dǎ diànhuà.', '私は母に電話をかけます。'], ['電話', '电话', 'diànhuà']],
  ['汉字', 'Hànzì', '漢字', null, ['汉字很难。', 'Hànzì hěn nán.', '漢字は難しい。'], ['漢字', '汉字', 'Hànzì']],
  ['大学', 'dàxué', '大学', null, ['我是大学生。', 'Wǒ shì dàxuéshēng.', '私は大学生です。'], ['大学', '大学', 'dàxué']],
  ['学生', 'xuésheng', '学生', null, ['他是学生。', 'Tā shì xuésheng.', '彼は学生です。'], ['学生', '学生', 'xuésheng']],
].map(([z, p, zh, ja, ex, rev]) => ({ z, p, zh, ja, ex: Array.isArray(ex) ? { zh: ex[0], py: ex[1], ja: ex[2] } : ex, rev, audio: (WORDS.find(w => w.hanzi === z) || {}).audio }));
// 選択肢に出す「日本語の意味」（形をそろえて、かっこの有無などで答えが分からないように）
const TRAP = { 手纸: '手紙', 汽车: '汽車', 勉强: '勉強する', 老婆: 'おばあさん', 丈夫: 'じょうぶな', 爱人: '恋人', 新闻: '新聞', 东西: '東と西', 大家: '家主', 走: '走る', 告诉: '訴える', 工作: 'ものを作ること', 汤: 'お湯', 便宜: '都合がよい', 颜色: '顔色', 看病: '病人の世話をする', 结束: '団結する', 先生: '教師', 去: '去る', 床: 'ゆか', 怪我: 'けが' };
D.forEach(d => d.trap = TRAP[d.z] || null);
// ⚠先生確認（前端レビュー後に追加）：「同じ意味の語」にも、ありそうだけど違う選択肢を1つ入れる。
// これで、どの問題にも「それらしい選択肢」が2つずつあり、「それらしいのが1つなら同じ意味の語」という見分け方ができなくなる。
const SAMETRAP = { 学校: ['校舎（建物）', '学院', 'xuéyuàn'], 时间: ['時計', '时候', 'shíhou'], 电话: ['電報', '电报', 'diànbào'], 汉字: ['ひらがな', '中文', 'Zhōngwén'], 大学: ['大学生', '大学生', 'dàxuéshēng'], 学生: ['小学生', '学者', 'xuézhě'] };
D.forEach(d => { if (!d.ja && SAMETRAP[d.z]) { d.strap = SAMETRAP[d.z][0]; d.strap2 = SAMETRAP[d.z][1]; d.strap2p = SAMETRAP[d.z][2]; } });
// 意味が重なる語（夫・妻）は、おたがいの誤答にしない（丈夫「夫」の問題に 先生「〜さん・夫」や 爱人「配偶者」が出ると答えが2つになるため）
const CLASH = [['丈夫', '先生', '爱人', '老婆']];
const clash = (a, b) => CLASH.some(g => g.includes(a.z) && g.includes(b.z));
const PYOF = {}; D.forEach(d => { PYOF[d.z] = d.p; if (d.rev) PYOF[d.rev[1]] = d.rev[2]; if (d.strap2) PYOF[d.strap2] = d.strap2p; });
const FF = D.filter(d => d.ja), SAME = D.filter(d => !d.ja);
let lv = 1, qs = [], qi = 0, log = [];
const st = G.load(); st.miss = st.miss || {};
const LD = { 1: '中国語の語を見て、中国語での意味を選ぶ（10問）。', 2: '日本語の語を見て、中国語で何と言うかを選ぶ（10問）。同じ漢字の語がわなです。' };
function setLv(n) { lv = n; G.$$('#lv button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.l === n))); G.$('#ldesc').textContent = LD[n]; const top = Object.entries(st.miss).sort((a, b) => b[1] - a[1]).slice(0, 4); G.$('#tinfo').innerHTML = ''; if (top.length) G.$('#tinfo').append(G.h('p', { class: 'small' }, 'だまされやすい語：' + top.map(([k, v]) => `${k}（${v}回）`).join('、'))); }
G.$$('#lv button').forEach(b => b.onclick = () => setLv(+b.dataset.l));
function build(list) {
  let items = list;
  if (!items) { const nSame = 4 + Math.floor(G.rand() * 2); /* 同じ意味の語を4〜5問（「日本語と同じ字は必ずわな」という覚え方では半分しか当たらない） */ items = G.shuffle([...G.pick(FF.filter(d => lv === 1 || d.rev), 10 - nSame), ...G.pick(SAME, nSame)]); }
  return items.map(d => {
    if (lv === 1) {
      const others = G.shuffle(D.filter(x => x !== d && !clash(x, d) && x.zh !== d.zh && x.zh !== d.trap && x.zh !== d.strap)).map(x => x.zh);
      const opts = [d.zh, d.ja ? d.trap : d.strap, ...others.slice(0, 2)];
      return { d, ans: d.zh, opts: G.shuffle(opts) };
    }
    const r = d.rev, others = G.shuffle(D.filter(x => x !== d && !clash(x, d) && x.rev && x.rev[1] !== r[1] && x.z !== r[1] && x.rev[1] !== d.strap2)).map(x => x.rev[1]);
    const opts = [r[1], d.ja ? d.z : d.strap2, ...others.slice(0, 2)];
    return { d, ans: r[1], opts: G.shuffle([...new Set(opts)]) };
  });
}
let lastStart = -1e9;
function start(list) { if (performance.now() - lastStart < 600 || (list && !list.length)) return; lastStart = performance.now(); G.clearAll(); qs = build(list); qi = 0; log = []; G.show('play'); ask(); }
function ask() {
  const q = qs[qi], d = q.d, c = G.$('#qcard'); c.innerHTML = ''; G.$('#fb').innerHTML = ''; G.$('#next').style.display = 'none'; G.$('#bar').style.width = (qi / qs.length * 100) + '%';
  G.$('#hud').textContent = `${qi + 1} / ${qs.length}`;
  if (lv === 1) c.append(G.h('p', { class: 'small mt0' }, '中国語でのこの語の意味は？'), G.zh(d.z, 'big'), G.h('p', { lang: 'zh-Latn-pinyin', style: 'font-size:18px;margin:0' }, d.p), d.audio ? G.audioBtn(d.audio) : null);
  else c.append(G.h('p', { class: 'small mt0' }, 'この日本語は、中国語で何と言う？'), G.h('p', { style: 'font-size:30px;font-weight:700;margin:4px 0' }, d.rev[0]), G.h('p', { class: 'small' }, `（意味：${d.ja ? d.trap : d.zh}）`));
  const box = G.$('#opts'); box.innerHTML = ''; const done = G.guard();
  q.opts.forEach(o => { const b = G.h('button', { class: 'opt' + (lv === 2 ? ' center' : ''), type: 'button' }, lv === 2 ? [G.zh(o, 'mid'), PYOF[o] ? G.pyh(PYOF[o]) : null] : o); b.onclick = done(() => answer(b, o)); box.append(b); });
  if (lv === 2) box.append(G.pyBtn());
  if (G.test) window.__t = { answer: q.ans, opts: q.opts, same: !d.ja, z: d.z, D, CLASH, build };
}
function answer(b, o) {
  const q = qs[qi], d = q.d, ok = o === q.ans; G.lock(G.$('#opts'));
  G.$$('#opts .opt').forEach((x, i) => { if (q.opts[i] === q.ans) x.classList.add('ok'); }); if (!ok) b.classList.add('ng');
  const trapped = !ok && d.ja && (o === d.trap || o === d.z);
  log.push({ q, ok, trapped }); if (!ok) { st.miss[d.z] = (st.miss[d.z] || 0) + 1; G.save(st); }
  const ex = d.ex;
  G.$('#fb').append(G.h('div', { class: 'fb ' + (ok ? 'ok' : 'ng') },
    G.h('b', {}, ok ? '正解！' : trapped ? '日本語の意味にだまされた！' : '不正解'),
    G.h('div', { class: 'cmp' }, G.h('b', {}, '中国語'), G.h('span', {}, G.zh(d.z), ` ${d.p}：${d.zh}`), G.h('b', {}, '日本語'), G.h('span', {}, d.ja ? `「${d.ja}」` : '同じ意味です')),
    G.h('div', { class: 'ex' }, G.zh(ex.zh, 'mid'), G.py(ex.py), G.ja(ex.ja), ex.lesson ? G.h('span', { class: 'kb' }, '教科書の文') : null, ex.audio ? G.audioBtn(ex.audio) : null),
    d.rev && d.ja ? G.h('p', { class: 'small' }, `日本語の「${d.rev[0]}」は中国語で `, G.zh(d.rev[1]), ` ${d.rev[2]}`) : null,
    G.h('p', { class: 'small mt0' }, G.chk())));
  const nx = G.$('#next'); nx.textContent = qi + 1 < qs.length ? '次へ' : '結果を見る'; nx.style.display = 'block'; nx.disabled = false; G.reveal(G.$('#fb'));
}
G.$('#next').onclick = () => { const nx = G.$('#next'); if (nx.disabled) return; nx.disabled = true; qi++; if (qi < qs.length) ask(); else finish(); };
function finish() {
  G.clearAll(); G.$('#hud').textContent = ''; const n = log.filter(l => l.ok).length, tr = log.filter(l => l.trapped).length;
  G.$('#score').innerHTML = ''; G.$('#score').append(G.h('p', { style: 'font-size:30px;font-weight:700;margin:0' }, `${n} / ${log.length}`), G.h('p', {}, `日本語の意味にだまされた：${tr}回`));
  const r = G.$('#rlist'); r.innerHTML = ''; r.append(G.h('h3', { class: 'mt0' }, '今回の語'));
  log.forEach(l => r.append(G.h('p', {}, (l.ok ? '○ ' : '✗ '), G.zh(l.q.d.z, 'mid'), ` ${l.q.d.p}　${l.q.d.zh}`, l.q.d.ja ? G.h('span', { class: 'small' }, `（日本語「${l.q.d.ja}」）`) : G.h('span', { class: 'small' }, '（同じ意味）'))));
  G.$('#retry').style.display = log.some(l => !l.ok) ? 'block' : 'none'; G.show('result');
}
G.$('#go').onclick = () => start(); G.$('#again').onclick = () => start();
G.$('#retry').onclick = () => start(log.filter(l => !l.ok).map(l => l.q.d));
G.$('#toTitle').onclick = () => { G.clearAll(); G.stopAudio(); G.$('#hud').textContent = ''; setLv(lv); G.show('title'); };
setLv(1);
