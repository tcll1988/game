<!DOCTYPE html>
<!--
【09 量詞マッチ（量词连连看）】 設計メモ（合成版：Grok Bot 版を土台に、各AI版の検証済みの長所を統合）
■学習目標：名詞と量詞の組み合わせ。日本の学生は「本＝細長い物」「台＝車」など日本語の助数詞に引っぱられて
  「一本笔」はできても「一本书」「一辆车」で迷う。日本語の助数詞との違い（本↔冊、张≈枚、辆↔台）を毎回はっきり示す。
■一局：盤面5面（1面＝名詞4つ×量詞4つ）で約3分。上級は10問で約2分。
■画面：タイトル（レベル・ベスト）→ 盤面（名詞をタップ→量詞をタップ。正しいと「一本书 yì běn shū」が出る、
  違うと揺れて日本語の助数詞とのちがいのヒント）→ 5面終わると結果（時間・ミス数・ミスしたペア）→ 復習。
■素材：名詞・量詞・組み合わせ・説明はすべて新しく作成（⚠先生確認）。40語にある名詞だけ先生の声（合成）の音声を使う。
  盤面は「その面の中で正解の組み合わせが1通りしかない」ように自動で作る（例：狗は只・条どちらも可なので、只と条を同じ面に出さない）。
■難度：初級＝名詞に日本語訳とピンイン　中級＝漢字だけ　上級＝「两＿猫」の空欄に入る量詞を4択（10問）。
■一の声調変化：「一」は後ろが第4声（个も本来は第4声）なら yí、それ以外は yì と表示。上級は「两 liǎng」なので変化なし。
■スマホ・iPhone：左右2列、1つのボタン高さ52px以上。タップ順はどちらからでもOK。
■効果の確かめ方：ペアごとのミス回数を保存し、タイトルに「よくまちがえるペア」を表示。
■リスク：量詞は地域・話し言葉で幅がある（例：椅子は「把」が普通だが「张」も可）。許容範囲は先生の確認が必要。
■前端レビュー後：できたことばを「次の盤面へ」より上に表示し、ボタンは画面下に固定。中級・小テストは「ピンインを表示」でピンインを確認できる。音声ボタンは「▶ 名詞」と表示（名詞だけを読む音声のため）。
-->

<style>:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--sub:#666;--line:#d9d4c7;--pri:#2f5d8a;--pri2:#e8f0f8;--ok:#1f7a4d;--okbg:#e5f5ec;--ng:#b3261e;--ngbg:#fde9e7;--warn:#8a5a00;--warnbg:#fff4d6;--r:14px}

<script>
'use strict';
/* 共通部品（各ファイルに同じものを埋め込み。外部ライブラリなし） */
const G = (() => {
  const GAME = document.documentElement.dataset.game || 'x';
  const KEY = 'cngame.' + GAME; // 合成版の保存キー
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

      else if (k === 'style') e.style.cssText = v;

  { const ap = Element.prototype.append; Element.prototype.append = function (...a) { return ap.apply(this, a.filter(x => x != null && x !== false)); }; }
  let rnd = Math.random;
  function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  let mem = {};

  function show(id) { $$('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }
  // ---- タイマー（重ねがけ防止：新しい回の前に必ず clearAll） ----
  const T = new Set();
  function after(ms, fn) { const id = setTimeout(() => { T.delete(id); fn(); }, ms); T.add(id); return id; }

  const au = new Audio(); au.preload = 'auto';
  let playSeq = 0;
  function play(url) {
    const seq = ++playSeq; const st = $('#astat');
    if (st) st.textContent = '';
    return new Promise(res => {
      if (!url) return res(false);

  function pyBtn() { const b = h('button', { class: 'btn inline ghost pybtn', type: 'button', 'aria-pressed': String(document.body.classList.contains('showpy')) }, document.body.classList.contains('showpy') ? 'ピンインを隠す' : 'ピンインを表示'); b.onclick = () => { const on = document.body.classList.toggle('showpy'); $$('.pybtn').forEach(x => { x.textContent = on ? 'ピンインを隠す' : 'ピンインを表示'; x.setAttribute('aria-pressed', String(on)); }); }; return b; }
  const chk = () => h('span', { class: 'chk' }, '⚠先生確認');
  const kb = t => h('span', { class: 'kb' }, t);
  function plain(p) { return p.normalize('NFD').replace(/[\u0300-\u0304\u0306\u0307\u0309-\u036f]/g, '').normalize('NFC'); }
  let toastT = 0;
  function toast(m) { let t = $('.toast'); if (!t) { t = h('div', { class: 'toast', role: 'status' }); document.body.append(t); } t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }

  function guard() { let used = false; const born = performance.now(); return fn => (...a) => { if (used || performance.now() - born < 300) return; used = true; fn(...a); }; } // 表示直後0.3秒のタップは前の画面の連打とみなして無視

    if (!e.isTrusted) return;
    const SEL = 'button,a,[role=button],.opt,.part,.tile,.hole', now = performance.now(), el = e.target.closest(SEL);

  }, true);

  const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fh() { const f = document.querySelector('footer.note'); document.documentElement.style.setProperty('--fh', (f ? f.offsetHeight : 0) + 'px'); }
  addEventListener('resize', fh); document.addEventListener('DOMContentLoaded', fh); setTimeout(fh, 0);
  // 声調の誤答選択肢に使わない声調（その字の別の正しい読み・変調形）。例：好 hào、和 hè、喝 hè、读 dù、不 bú/bù、都 dū、的 dí/dì
  const BANT = { 好: [4], 和: [4], 喝: [4], 读: [4], 不: [2, 4], 都: [1], 的: [2, 4], 少: [4], 分: [4], 作: [1], 兴: [1], 打: [2], 八: [2], 个: [3], 语: [4] };

  return { GAME, $, $$, h, shuffle, pick, seeded, setRand: f => rnd = f, rand: () => rnd(), load, save, show, after, every, clearAll, play, stopAudio, audioBtn, zh, py, ja, chk, kb, plain, toast, guard, lock, today, test, reveal, reduce, pyh, pyBtn, BANT, banTone };

  qlog.push(ok);
  G.$('#qfb').append(G.h('div', { class: 'fb ' + (ok ? 'ok' : 'ng') }, G.h('b', {}, ok ? '正解！' : '不正解'), ' ', G.zh('两' + q.n.m + q.n.z, 'mid'), ' ', G.h('span', { lang: 'zh-Latn-pinyin' }, 'liǎng ' + MW[q.n.m][0] + ' ' + q.n.p), q.n.audio ? G.audioBtn(q.n.audio, '▶ ' + q.n.z) : null, G.h('p', { class: 'small' }, '「' + q.n.m + '」：' + MW[q.n.m][1] + ' ', G.chk())));
  const nx = G.$('#qnext'); nx.textContent = qi + 1 < qs.length ? '次へ' : '結果を見る'; nx.style.display = 'block'; nx.disabled = false; G.reveal(G.$('#qfb'));
}
G.$('#qnext').onclick = () => { const nx = G.$('#qnext'); if (nx.disabled) return; nx.disabled = true; qi++; if (qi < qs.length) qask(); else finish(); };
function finish() {
  G.clearAll(); const sec = Math.round((performance.now() - t0) / 1000); G.$('#hud').textContent = '';
  const s = G.$('#score'); s.innerHTML = '';
  let label;
  if (lv === 3) { const n = qlog.filter(Boolean).length; label = `${n} / 10・${sec}秒`; s.append(G.h('p', { style: 'font-size:30px;font-weight:700;margin:0' }, `${n} / 10`), G.h('p', {}, `${sec}秒`)); }
  else { label = `${sec}秒・ミス${mistakes.length}`; s.append(G.h('p', { style: 'font-size:30px;font-weight:700;margin:0' }, `${sec}秒`), G.h('p', {}, `ミス ${mistakes.length} 回（20ペア）`)); }
  st.best[lv] = st.best[lv] ? (better(label, st.best[lv]) ? label : st.best[lv]) : label; G.save(st);
  const m = G.$('#miss'); m.innerHTML = ''; m.append(G.h('h3', { class: 'mt0' }, mistakes.length ? 'まちがえた組み合わせ' : 'ノーミス！'));
  const seen = new Set(); mistakes.forEach(x => { if (seen.has(x.n.z)) return; seen.add(x.n.z); const ph = phrase(x.n, x.n.m); m.append(G.h('p', {}, `✗ ${x.m}${x.n.z} → `, G.zh(ph.z, 'mid'), ' ', G.h('span', { lang: 'zh-Latn-pinyin' }, ph.p))); });
  G.show('result');
}
function better(a, b) { const num = s => s.match(/\d+/g).map(Number); const A = num(a), B = num(b); return lv === 3 ? (A[0] > B[0] || (A[0] === B[0] && A[2] < B[2])) : (A[1] < B[1] || (A[1] === B[1] && A[0] < B[0])); }
G.$('#go').onclick = start; G.$('#again').onclick = start;
