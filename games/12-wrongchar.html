<!DOCTYPE html>
<!--
【12 簡体字チェック（その字、中国の字？）】 設計メモ（合成版：Grok Bot 版を土台に、各AI版の検証済みの長所を統合）
■学習目標：中国（大陸）で使う簡体字を正しく選べるようにする。日本の学生がいちばん書きまちがえるのは
  「日本の字（気・読・対・歩・毎）」や「繁体字（電・話）」をそのまま書くこと。だから「多い一画・少ない一画」の
  わざと作った字ではなく、実際に書きがちな「日本の字」「繁体字」をわなにする。
  ・わなは「同じ語・同じ意味の、別の地域の字形」（日本の字・繁体字）。同音・近い音の字（气→汽）は使わない（正解が2つになるのを防ぐ）。
  ・前端レビュー後、2択の字には3つ目として「形の似た別の字」を足した。この字も、同じ音節の字（块→快、厉→历、钟↔种、机→肌 など）や、
    入れると別の語になる字（分钟→分针 など）は使わない（確認成品内容レビューで入れ替え）。
  ・日本の字と同じ形が正解の語（学・医・体・写・点…）も混ぜ、「日本の字を避ければ正解」「画数が少ないほうが正解」では解けないようにする
    （図・黒・毎・売 のように日本の字のほうが画数が少ない語もある）。
■一局：タイムアタック 60 秒（何問でも）または じっくり 10 問（毎問解説）。約 1〜3 分。
■画面：タイトル（やり方・今日のベスト・連続日数）→ 問題（語の 1 字が □、ピンイン、意味、3 択）→ 結果（正解数・
  「日本の字を選んだ回数」「繁体字を選んだ回数」・まちがえた字の一覧と字形の説明）。
■素材：sample_words.json の 40 語と、教科書（第10課会話・第11課読解）に出る語から字を選んだ。字形の分類と、新しく足した語
  （图书馆・黑色・散步・每天・别的・中国・时间）・語のピンイン・意味は新しく作成（⚠先生確認）。40語の語は語の音声を使う。
■難度：タイムアタック（速さ）／じっくり（解説つき）。選択肢はすべて 3 択（日本の字と繁体字が同じ形の字は、形の似た別の字を足す）。
■スマホ・iPhone：選択肢は大きな字で横並び（1 マス 64px 以上）。画面が変わった直後の 2 回目のタップは無視。
■効果の確かめ方：字ごとの正誤・「日本の字を選んだ回数」を保存し、タイトルに「よくまちがえる字」を表示。
■リスク：繁体字は台湾・香港では正しい字なので、「まちがい」ではなく「大陸の簡体字ではない」と表示する。
  写・骨 などは日中で同じ文字コードでも書体で形が違う（この端末のフォントで表示が変わる）ので出題しない（写は「繁体字 寫」との区別だけ）。
■前端レビュー後：選択肢が2つになる字には、形の似た別の字（一画・部品ちがい、⚠先生確認）を1つ足して3択にする。
-->

  const lab = G.h('div', { class: 'lab' }, ...it.opts.flatMap(x => [G.zh(x), G.h('span', {}, (x === it.ans ? '✓ ' : '') + KIND(it, x))]));
  const same = [it.J === it.ans ? '日本の字も同じ形です。' : it.J ? '' : '日本ではふつうこの字を使いません。', it.T === it.ans ? '繁体字も同じ形です。' : ''].filter(Boolean).join(' ');
  fb.append(G.h('div', { class: 'fb ' + (ok ? 'ok' : 'ng') }, G.h('b', {}, ok ? '正解！' : 'ざんねん。正しいのは「' + it.ans + '」'), mode === 'slow' || !ok ? lab : null, same && (mode === 'slow' || !ok) ? G.h('p', { class: 'small' }, same) : null,
    mode === 'slow' && it.audio ? G.audioBtn(it.audio, '▶ 語を聞く') : null));
  if (mode === 'ta') { G.clearAll(); G.every(100, tick); G.after(ok ? 450 : 1600, () => { if (!over) { qi++; ask(); } }); }
  else { const nx = G.$('#next'); nx.style.display = ''; nx.disabled = false; nx.textContent = qi + 1 < qs.length ? '次へ' : '結果を見る'; G.reveal(nx); }
}
G.$('#next').onclick = () => { const nx = G.$('#next'); if (nx.disabled) return; nx.disabled = true; qi++; ask(); };
function finish() {
  if (ended) return; ended = true; G.clearAll(); G.stopAudio(); over = true;
  const n = log.filter(x => x.ok).length, jpN = log.filter(x => !x.ok && x.pick === x.it.J).length, twN = log.filter(x => !x.ok && x.pick === x.it.T && x.pick !== x.it.J).length;
  let msg = '';
  if (mode === 'ta') { const d = dayOf(), prev = S.days[d]; if (prev == null || n > prev) { S.days[d] = n; msg = prev == null ? '今日の記録になりました' : '今日のベスト更新！'; } else msg = '今日のベスト：' + prev + '問'; G.save(S); }
  const sc = G.$('#score'); sc.innerHTML = '';
  sc.append(G.h('div', { class: 'big' }, mode === 'ta' ? '正解 ' + n + ' 問' : n + ' / ' + log.length),
    G.h('p', {}, '答えた数 ' + log.length + '　' + msg), G.h('p', { class: 'small' }, '日本の字を選んだ：' + jpN + '回　繁体字を選んだ：' + twN + '回'),
    mode === 'ta' && streak() ? G.h('p', {}, '🔥 ' + streak() + '日連続') : '');
  const rl = G.$('#rlist'); rl.innerHTML = '';
  const miss = log.filter(x => !x.ok);
  rl.append(G.h('h3', { class: 'mt0' }, miss.length ? 'まちがえた字' : 'まちがいなし！'));
  miss.forEach(x => rl.append(G.h('div', { class: 'lab' }, G.zh(x.it.ans), G.h('span', {}, x.it.w + '（' + x.it.p + '）：「' + x.pick + '」は' + x.kind))));
  G.$('#hud').textContent = ''; G.show('result');
  if (window.__t) window.__t.result = { n, total: log.length, jpN, twN };
}
if (G.test) window.__t = { items: ITEMS, left };
renderTitle();
</script>
