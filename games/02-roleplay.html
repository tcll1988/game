<!DOCTYPE html>
<!--
【02 会話ロールプレイ：お買い物クエスト】 設計メモ（合成版：Grok Bot 版を土台に、各AI版の検証済みの長所を統合）
■学習目標：会話 第10課「买东西」の場面で「次に自分（B）が言うべき一文」を選ぶ。値段の聞き方、有点儿贵／便宜一点儿、
  量詞（盒儿・件）、把它包起来吧 などを、場面の目的（ミッション）と結びつけて覚える。日本の学生は文を訳で覚えがちなので、
  「何をしたいか（日本語のミッション）→中国語の一文」の向きで練習させる。まちがえると「ハプニング結末」が見られるので、
  なぜ違うかが記憶に残る（12種類集めたくなる）。
■一局：2つのお店（お茶6文・シャツ7文、本文13文すべて）、選択6回。約4〜6分。
■画面：タイトル（モード、集めた結末 x/18）→ 会話中（店員の文＋音声、ミッション、選択肢4つ）
  → 正解（本文どおり、自分の文の音声）／不正解（ハプニング結末・理由・その場面からやり直し）→ クリア（初回正解数、結末コレクション）
  → 復習（本文13文を通しで、1文ずつ音声・ピンイン・訳）。
■素材：kaiwa_lesson10.js の13文を一字も変えずに使用（表示時に先頭の「A:」「B:」だけ外して話者を吹き出しで示す）。
  音声＝https://tcll1988.github.io/kaiwa-dokai/ ＋ 相対パス。新しく書いた内容：不正解の選択肢12文（中国語・ピンイン・訳）、
  結末12個、ミッション文 → すべて ⚠先生確認（我々の前回サンプルの review_items_B.csv と同じ内容）。
  ⚠の表示は選択肢の上にまとめて1つだけ出し、どれが本文かは答えたあとに表示（⚠で答えが分からないようにする）。
  選択肢には音声ボタンを付けない（本文の文だけ音声があると答えが分かるため）。並び順は毎回ランダム。
■合成版（2026-10-26）：網頁版 Claude 02 の「店員（A）になる」役を移植。店員の番は、同じお店の店員の本文の文（重複を除く）から選ぶ。新しい中国語は作らない。
■難度：やさしい（店員の文に訳）／ふつう（訳なし、ピンインあり）／チャレンジ（ピンインは「ピンインを表示」で出す）。
■前端レビュー後：選択肢は4つ（本文・本文を少し変えた「ありそうだけど違う」文・ハプニング文2つ）。選択肢の訳は答えたあとに出す
  （訳とミッションを照らすだけで分かってしまうため）。結末は18種類。
■スマホ・iPhone：最初のタップで音声解錠。自動再生が止められても▶ボタンで聞ける。失敗は画面内に表示（alertなし）。
■効果の確かめ方：初回正解数と、どの場面でまちがえたかを端末に保存。授業前後で「ふつう」の初回正解数を比べる。
  授業で本文の口頭再生テスト（ミッションを聞いて中国語で言う）と組み合わせる。
■リスク：選ぶだけなので発話力は直接は伸びない（08/11 と組み合わせる）。新作の文と結末は先生の確認が必要。
  本文の和訳（例：10k-h-17「こちらはいかがと思いますか」）は教材のまま表示している。
-->

<style>:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--sub:#666;--line:#d9d4c7;--pri:#2f5d8a;--pri2:#e8f0f8;--ok:#1f7a4d;--okbg:#e5f5ec;--ng:#b3261e;--ngbg:#fde9e7;--warn:#8a5a00;--warnbg:#fff4d6;--r:14px}

<body>
<header class="top"><a class="home" href="../index.html" aria-label="目次にもどる">← 目次</a><h1>お買い物クエスト</h1><span class="hud" id="hud"></span></header>
<main class="wrap">
<section class="screen on" id="title">
  <div class="card"><h2>会話 第10課「买东西」</h2>
  <p>あなたはお客さん（B）。店員さんの話を聞いて、<b>ミッションに合う一文</b>を選ぼう。まちがえるとハプニングが起きます。</p>

  <button class="btn ghost" id="toTitle2" type="button">タイトルへ</button>
</section>
</main>
<footer class="note">音声：先生の声をもとに合成（本文の録音）</footer>
<script>
'use strict';
/* 共通部品（各ファイルに同じものを埋め込み。外部ライブラリなし） */
const G = (() => {

  function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function pick(a, n, r = rnd) { return shuffle(a, r).slice(0, n); }

  let mem = {};
  function load() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : {}; } catch (e) { return mem; } }
  function save(o) { mem = o; try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { } }
  // ---- 画面切り替え ----
  function show(id) { $$('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }
  // ---- タイマー（重ねがけ防止：新しい回の前に必ず clearAll） ----
  const T = new Set();
  function after(ms, fn) { const id = setTimeout(() => { T.delete(id); fn(); }, ms); T.add(id); return id; }

  const au = new Audio(); au.preload = 'auto';
  let playSeq = 0;

    return new Promise(res => {

  function pyBtn() { const b = h('button', { class: 'btn inline ghost pybtn', type: 'button', 'aria-pressed': String(document.body.classList.contains('showpy')) }, document.body.classList.contains('showpy') ? 'ピンインを隠す' : 'ピンインを表示'); b.onclick = () => { const on = document.body.classList.toggle('showpy'); $$('.pybtn').forEach(x => { x.textContent = on ? 'ピンインを隠す' : 'ピンインを表示'; x.setAttribute('aria-pressed', String(on)); }); }; return b; }
  const chk = () => h('span', { class: 'chk' }, '⚠先生確認');
  const kb = t => h('span', { class: 'kb' }, t);
  function plain(p) { return p.normalize('NFD').replace(/[\u0300-\u0304\u0306\u0307\u0309-\u036f]/g, '').normalize('NFC'); }
  let toastT = 0;
  function toast(m) { let t = $('.toast'); if (!t) { t = h('div', { class: 'toast', role: 'status' }); document.body.append(t); } t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }
  // ---- 連打対策：1問につき1回だけ受け付ける ----
  function guard() { let used = false; const born = performance.now(); return fn => (...a) => { if (used || performance.now() - born < 300) return; used = true; fn(...a); }; } // 表示直後0.3秒のタップは前の画面の連打とみなして無視

  const today = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  // ---- 連打対策：前のタップの時点で見えていなかった要素への 0.35 秒以内のタップは無視（画面が変わった直後の指の2回目） ----
  let lastTap = -1e9, seenVis = new WeakMap();

        b.classList.add('ng', 'shake'); b.disabled = true;
        const old = G.$('#afb', box); if (old) old.remove();
        const fb = G.h('div', { class: 'fb ng', id: 'afb' }, G.h('b', {}, '× ここで言う文ではありません。'), ' 「', G.zh(strip(LINE[x].ch)), '」は「', LINE[x].jp.replace(/[。．]$/, ''), '」という意味です。お客さんの話をもう一度聞いて、選び直そう。');
        box.append(fb); G.reveal(fb);
      }
    };
    list.append(b);
  });
  box.append(list); if (mode === 'hard') box.append(G.pyBtn());
  const last = G.$$('#chat .bub').pop(); box.prepend(G.h('p', { class: 'small' }, last ? '直前のお客さんの文は上の吹き出し（▶で聞けます）。' : 'お客さんがお店に入ってきました。最初のひとことは？'));
  if (G.test) window.__t = { correctText: strip(LINE[id].ch), role: 'A' };
}
let mode = 'easy', shop = 0, step = 0, firstTry = 0, tried = {}, curChoice = null;
const MD = { easy: '店員さんの文に日本語訳を表示します（選択肢の訳は答えたあとに）。', normal: '訳は出しません（ピンインは表示）。', hard: 'ピンインは「ピンインを表示」を押したときだけ出ます。' };
function setMode(m) { mode = m; G.$$('#mode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === m))); G.$('#mdesc').textContent = MD[m]; }
G.$$('#mode button').forEach(b => b.onclick = () => setMode(b.dataset.m));
function renderCol() {
  const c = G.$('#ecol'); c.innerHTML = '';
  WKEYS.forEach((k, i) => c.append(G.h('span', { class: st.endings.includes(k) ? 'got' : '' }, st.endings.includes(k) ? STORY.wrong[k].e[0] : '？ No.' + (i + 1))));
  G.$('#ecount').textContent = `${st.endings.length} / ${WKEYS.length}`;
}
function bubble(l, me) {
  const b = G.h('div', { class: 'bub' + (me ? ' me' : '') }, G.h('span', { class: 'who' }, me ? 'あなた（お客さん（B））' : '店員（A）'), G.zh(strip(l.ch), 'mid'), G.py(l.py), mode === 'easy' ? G.ja(l.jp) : null, G.audioBtn(url(l)));
  G.$('#chat').append(b); b.scrollIntoView({ block: 'end', behavior: G.reduce() ? 'auto' : 'smooth' });
}
function start(fromShop = 0, fromStep = 0) {
  G.clearAll(); G.stopAudio();
  if (fromShop === 0 && fromStep === 0) { firstTry = 0; tried = {}; }
  shop = fromShop; step = fromStep; G.$('#chat').innerHTML = ''; G.show('play'); advance();
}
function advance() {
  const s = STORY.shops[shop]; G.$('#place').textContent = '📍 ' + s.name + '（' + (shop + 1) + '/2）';
  G.$('#ask').innerHTML = '';
  if (step >= s.lines.length) {
    if (shop === 0) { G.$('#ask').append(G.h('div', { class: 'fb info' }, 'お茶を買えた！ つぎは服の店へ。'), G.h('button', { class: 'btn', type: 'button', onclick: G.guard()(() => { shop = 1; step = 0; G.$('#chat').innerHTML = ''; advance(); }) }, '次へ（服の店）')); return; }
    return finish();
  }
  const id = s.lines[step];
  if (LINE[id]) { bubble(LINE[id], false); G.play(url(LINE[id])); step++; G.$('#ask').append(G.h('button', { class: 'btn', type: 'button', onclick: G.guard()(advance) }, '次へ')); return; }
  ask(id);
}
function ask(cid) {
  curChoice = cid; const c = STORY.choice[cid];
  G.$('#hud').textContent = 'ミッション ' + (Object.keys(STORY.choice).indexOf(cid) + 1) + '/6';
  const box = G.$('#ask'); box.innerHTML = '';
  box.append(G.h('div', { class: 'goal' }, '🎯 ' + c.goal));
  box.append(G.h('p', { class: 'small' }, G.chk(), ' 選択肢には練習用に新しく作った文が含まれます。どれが本文かは答えたあとに表示します。'));
  const opts = G.shuffle([{ ok: true, l: LINE[c.ok] }, ...c.ng.map(k => ({ ok: false, k, w: STORY.wrong[k] }))]);
  const list = G.h('div', { class: 'opts' }); const once = G.guard();
  opts.forEach(o => {
    const zh = o.ok ? strip(o.l.ch) : o.w.zh, py = o.ok ? o.l.py : o.w.py, ja = o.ok ? o.l.jp : o.w.ja;
    const b = G.h('button', { class: 'opt', type: 'button' }, G.zh(zh, 'mid'), mode !== 'hard' ? G.py(py) : G.pyh(py)); // 選択肢の訳は出さない（訳とミッションを照らし合わせるだけで答えが分かるため）
    b.onclick = once(() => choose(o, b, list));
    list.append(b);
  });
  box.append(list); if (mode === 'hard') box.append(G.pyBtn());
  if (G.test) window.__t = { correctText: strip(LINE[c.ok].ch) };
}
function choose(o, b, list) {
  G.lock(list);
  if (!tried[curChoice]) { tried[curChoice] = 1; if (o.ok) firstTry++; }
  if (o.ok) {
    b.classList.add('ok'); bubble(o.l, true); G.play(url(o.l)); step++;
    G.$('#ask').append(G.h('div', { class: 'fb ok' }, G.h('b', {}, '○ 本文どおり！ '), G.kb('本文'), mode === 'hard' ? G.py(o.l.py) : null, G.ja(o.l.jp)));
    G.$('#ask').append(G.h('button', { class: 'btn stick', type: 'button', onclick: G.guard()(advance) }, '次へ'));
  } else {
    b.classList.add('ng'); G.stopAudio();
    if (!st.endings.includes(o.k)) { st.endings.push(o.k); G.save(st); }
    const [t, story, why] = o.w.e;
    const eb = G.$('#endBox'); eb.innerHTML = '';
    eb.append(G.h('p', { class: 'small' }, 'ハプニング結末 ', G.chk()), G.h('h2', {}, '💥 ' + t), G.h('p', {}, story),
      G.h('div', { class: 'fb info' }, G.h('b', {}, 'あなたが言ったこと：'), G.zh(o.w.zh), G.py(o.w.py), G.ja(o.w.ja + '（練習用に作った文 ⚠先生確認）')),
      G.h('p', {}, G.h('b', {}, 'なぜ？ '), why));
    G.$('#retry').disabled = false;
    G.show('end');
  }
}
G.$('#retry').onclick = () => { const b = G.$('#retry'); if (b.disabled) return; b.disabled = true; G.show('play'); const box = G.$('#ask'); box.innerHTML = ''; ask(curChoice); };
function finish() {
  G.clearAll(); G.$('#hud').textContent = '';
  const sc = G.$('#score'); sc.innerHTML = '';
  if (role === 'A') {
    if (st.bestA == null || firstTry > st.bestA) st.bestA = firstTry; G.save(st);
    sc.append(G.h('p', { style: 'font-size:28px;font-weight:700;margin:0' }, `一発正解 ${firstTry} / ${NA}`), G.h('p', {}, '★'.repeat(firstTry >= NA ? 3 : firstTry >= NA - 2 ? 2 : 1) + '　店員の自己ベスト ' + st.bestA + ' / ' + NA), G.h('p', { class: 'small' }, '次はお客さん（B）でもやってみよう。'));
    G.show('result'); return;
  }
  if (st.best == null || firstTry > st.best) st.best = firstTry; G.save(st);
  sc.append(G.h('p', { style: 'font-size:28px;font-weight:700;margin:0' }, `一発正解 ${firstTry} / 6`), G.h('p', {}, '★'.repeat(firstTry >= 6 ? 3 : firstTry >= 4 ? 2 : 1) + '　自己ベスト ' + st.best + ' / 6'), G.h('p', {}, `ハプニング結末 ${st.endings.length} / ${WKEYS.length} を発見`), G.h('p', { class: 'small' }, '結末を全部見たい人は、わざとまちがえてみよう。'));
  G.show('result');
}
function renderReview() {
  const box = G.$('#rlist'); box.innerHTML = '';
  KAIWA.forEach(l => box.append(G.h('div', { class: 'bub' + (/^B/.test(l.ch) ? ' me' : ''), style: 'margin:8px 0;max-width:100%' }, G.h('span', { class: 'who' }, /^B/.test(l.ch) ? 'お客さん（B）' : '店員（A）'), G.zh(strip(l.ch), 'mid'), G.py(l.py), G.ja(l.jp), G.audioBtn(url(l)))));
}
G.$('#go').onclick = () => role === 'A' ? startA() : start();
G.$('#again').onclick = () => role === 'A' ? startA() : start();
G.$('#toReview').onclick = () => { renderReview(); G.show('review'); };
G.$('#toTitle').onclick = G.$('#toTitle2').onclick = G.$('#endTitle').onclick = () => { G.clearAll(); G.stopAudio(); renderCol(); G.$('#hud').textContent = ''; G.show('title'); };
setMode('easy'); setRole('B'); renderCol();
</script>
