<!DOCTYPE html>
<!--
【03 読解探偵：高橋さん遅刻事件】 設計メモ（合成版：Grok Bot 版を土台に、各AI版の検証済みの長所を統合）
■学習目標：読解 第11課「高桥迟到了」を読み、質問の答えと「その根拠になる一文」を本文から見つける。
  日本の学生は漢字の意味から推測して「なんとなく」答えがちなので、根拠の文を指でさすことで、
  因为…所以…、才、…得很晚／得厉害 などの読み取りを確かめる。最後に「なぜ遅刻したか」を推理する。
■一局：質問5問（答え＋根拠）＋推理1問。約5〜7分。
■画面：タイトル（事件の依頼、レベル）→ 証言を読む（本文9文、1文ずつ音声）→ 捜査（質問、選択肢3つ、根拠の文を1つ選ぶ、判定）
  → 判定（答え○×・根拠○×、正しい根拠の文を表示）→ 推理（なぜ遅刻した？）→ 事件解決／推理ミス → 結果（点数・称号）
  → 復習（質問ごとに正解と根拠の文、音声）。
■素材：dokai_lesson11.js の9文を一字も変えずに表示（素材の空白・誤字もそのまま。先生への質問に記載）。
  音声＝https://tcll1988.github.io/kaiwa-dokai/ ＋ 相対パス。新しく書いた内容：事件の導入、質問5問と推理1問、選択肢、
  解説 → すべて ⚠先生確認。⚠は質問カードに1つ付け、選択肢には付けない（全部が新作なので差が出ない）。
  正解の位置は毎回ランダム。根拠の文は強調表示しない（前回 Gemini の「正解の文を色で示す」漏れを避ける）。
■難度：初級＝質問の日本語訳あり・本文の訳ボタンあり／中級＝中国語の質問だけ・訳なし。
■スマホ・iPhone：本文カードは縦に並べ、タップで根拠を選ぶ。音声は▶で1文ずつ。横はみ出しなし。
■効果の確かめ方：答えの正答と根拠の正答を分けて記録。授業前後で「根拠まで正しい」問題数を比べる。
■リスク：選択式なので、根拠が2文にまたがる読み（例：遅刻＝②③）は推理問題でしか問えない。
  素材の和訳「診査」は教材のまま（先生に確認）。
■合成版（2026-10-26）：網頁版 Claude 03 の Lv3「音声だけ」を移植し、上級（本文は文字なし・音声で証拠を探す）を追加。
■前端レビュー後：「判定する」を画面下に固定し、足りないもの（①答え・②証拠）を表示。問題の順番を毎回シャッフル。中級の証拠はピンインを「ピンインを表示」で見られる。「次へ」も画面下に固定。
-->

<script>
'use strict';

  const GAME = document.documentElement.dataset.game || 'x';

  { const ap = Element.prototype.append; Element.prototype.append = function (...a) { return ap.apply(this, a.filter(x => x != null && x !== false)); }; }

  function save(o) { mem = o; try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { } }
  // ---- 画面切り替え ----
  function show(id) { $$('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }
  // ---- タイマー（重ねがけ防止：新しい回の前に必ず clearAll） ----
  const T = new Set();

  function plain(p) { return p.normalize('NFD').replace(/[\u0300-\u0304\u0306\u0307\u0309-\u036f]/g, '').normalize('NFC'); }

  // ---- 連打対策：1問につき1回だけ受け付ける ----
  function guard() { let used = false; const born = performance.now(); return fn => (...a) => { if (used || performance.now() - born < 300) return; used = true; fn(...a); }; } // 表示直後0.3秒のタップは前の画面の連打とみなして無視

  const today = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  // ---- 連打対策：前のタップの時点で見えていなかった要素への 0.35 秒以内のタップは無視（画面が変わった直後の指の2回目） ----
  let lastTap = -1e9, seenVis = new WeakMap();
  document.addEventListener('click', e => {

  const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
