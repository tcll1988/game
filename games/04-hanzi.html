<!DOCTYPE html>
<!--
【04 漢字工房：部品で組み立てる簡体字】 設計メモ（合成版：Grok Bot 版を土台に、各AI版の検証済みの長所を統合）
■学習目標：簡体字の部品（偏・旁・冠など）と組み立て方を覚え、日本の漢字との違い（言→讠、食→饣、金→钅、見→见 など）を
  意識できるようにする。日本の学生はすでに日本の漢字を知っているので、「知っている字の形」を手がかりに、
  どこが簡体字で変わるのかを部品単位で比べるのが近道。逆に「同じ形で意味が違う字（机）」も示す。
■一局：ステージ①左右の字8問／②上下の字＋左右の復習8問／③日本の字はどれ？8問。各約3分。
■画面：タイトル（ステージ選択・ステージ別ベスト）→ 組み立て（語の中の1字が空欄、ピンイン・意味・音声、
  左右または上下の枠、部品6つ）→ 判定（できた字、日本の字との比較メモ）→ 結果（正解数、覚えた字）→ 復習（まちがえた字と部品）。
■素材：sample_words.json の40語に出てくる字だけを使う（語・ピンイン・意味・音声はそのまま）。
  新しく書いた内容：部品の分け方、日本の字との対応と説明、ステージ③の紛らわしい選択肢 → すべて ⚠先生確認。
  ⚠は判定後のメモと画面下に共通で出す（部品ボタンには付けないので答えは分からない）。
  「茶」（下が 木／朩／余 のどれか）は先生の判断待ちのため出題しない。「吃」「爸」の日本での扱いも先生確認。
■答えの漏れ対策：題目は空欄（「打电＿」など）で目標の字を見せない。部品の位置は毎回ランダム。
  日本の字の部品（言・食・金・見など）をわざと混ぜるので、日本の字の知識だけでは解けない。
■難度：①左右→②上下と混合→③日中対応（4択）。
■スマホ・iPhone：部品ボタンは64px角以上。枠をタップすると戻せる。部品の字（讠饣钅など）は簡体字フォント指定。
■効果の確かめ方：ステージ③（日本の字→簡体字の対応）の正答率を授業前後で比べる。小テストの部首の書きまちがい数を比べる。
■リスク：部品の分け方は字源と完全には一致しない（教育用の分け方）。端末のフォントにより部品の形が少し変わることがある（真機未確認）。
■前端レビュー後：部品の候補に、答えでない簡体字の部首（讠饣钅など）を毎回2つ入れる（簡体字＝正解、のパターンをなくす）。使った部品に✓、入れた部品はタップで外せる。「判定する」「次へ」を画面下に固定。
■成品確認後：③は日本語の意味（飛行機・電話など）に答えの字が入っているので、答えるまで意味を隠す。「語：」の見出しも「ことば：」に（「語」が答えの問題があるため）。
-->
<html lang="ja" data-game="04-hanzi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>漢字工房｜04</title>
<style>:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--sub:#666;--line:#d9d4c7;--pri:#2f5d8a;--pri2:#e8f0f8;--ok:#1f7a4d;--okbg:#e5f5ec;--ng:#b3261e;--ngbg:#fde9e7;--warn:#8a5a00;--warnbg:#fff4d6;--r:14px}

.wrap{max-width:560px;margin:0 auto;padding:12px 14px}

header.top h1{font-size:17px;margin:0;flex:1;line-height:1.3}

.btn.inline{display:inline-block;width:auto;min-width:44px;min-height:44px;padding:6px 14px;font-size:15px;margin:4px 4px 4px 0}

.zh{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif}

.py{display:block;font-size:16px;color:#355;letter-spacing:.02em}
.ja{display:block;font-size:16px;color:var(--sub)}

.kb{display:inline-block;font-size:14px;padding:1px 6px;border-radius:6px;background:var(--pri2);color:var(--pri);border:1px solid #bcd;white-space:nowrap}

.fb.ok{background:var(--okbg);border:1px solid #9fd3b6}.fb.ng{background:var(--ngbg);border:1px solid #efb1ab}

.audio{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:48px;min-height:48px;padding:6px 12px;border-radius:24px;border:1px solid var(--pri);background:#fff;color:var(--pri);font-size:15px;font-weight:600}
footer.note{position:fixed;left:0;right:0;bottom:0;background:#fffdf8;border-top:1px solid var(--line);font-size:14px;line-height:1.45;color:#555;padding:6px 10px calc(6px + env(safe-area-inset-bottom));text-align:center;z-index:6}
#astat{min-height:0;font-size:15px;color:var(--ng)}
.bar{height:8px;background:#e7e2d6;border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri);width:0;transition:width .2s}
table.t{width:100%;border-collapse:collapse;font-size:15px}table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.tag{display:inline-block;font-size:14px;border-radius:6px;padding:0 6px;background:#eee;color:#444}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.center{text-align:center}.mt0{margin-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.seg button{flex:1;min-width:90px;min-height:48px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:16px}
.seg button[aria-pressed=true]{border-color:var(--pri);background:var(--pri2);color:var(--pri);font-weight:700}

.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:.95}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 答えたあとの大事なボタンを、スマホの画面下に固定して親指で押せるようにする（下の説明欄の上に出る） */
.stick{position:sticky;bottom:calc(var(--fh,56px) + 6px);z-index:4;box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.stickbar{position:sticky;bottom:calc(var(--fh,56px));z-index:4;background:linear-gradient(rgba(246,244,239,0),var(--bg) 30%);padding:10px 0 2px;margin:0 -2px}
.stickbar .btn{margin:4px 0}
.py.hid{display:none}body.showpy .py.hid{display:block}
/* 前端共通指摘：G.reveal() で出した「次へ」が固定フッターの下に隠れないように */
.btn,.fb{scroll-margin-bottom:calc(var(--fh,56px) + 14px);scroll-margin-top:64px}

.frame{display:flex;justify-content:center;margin:10px auto;gap:6px}
.frame.tb{flex-direction:column;align-items:center}
.slotb{width:92px;height:92px;border:3px dashed var(--line);border-radius:14px;background:#fff;font-size:54px;display:flex;align-items:center;justify-content:center}
.frame.tb .slotb{width:120px;height:72px;font-size:46px}
.slotb.fill{border-style:solid;border-color:var(--pri)}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.part{min-height:72px;font-size:38px;border-radius:14px;border:2px solid var(--line);background:#fff}
.part{position:relative}.part.used{opacity:.45;background:#eee}.part.used::after{content:'✓';position:absolute;right:6px;top:2px;font-size:18px;color:var(--pri)}
.slotb{position:relative}.slotb.fill::after{content:'✕';position:absolute;right:4px;top:0;font-size:16px;line-height:1.4;color:var(--sub)}
.done{font-size:80px;line-height:1}
.cmp{display:flex;gap:14px;justify-content:center;align-items:center;margin:8px 0}
.cmp div{text-align:center}.cmp small{font-size:14px}.cmp .g{font-size:46px;line-height:1.1}
.opt4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt4 .opt{font-size:44px;text-align:center;min-height:84px}
</style>
</head>
<body>
<header class="top"><a class="home" href="../index.html" aria-label="目次にもどる">← 目次</a><h1>漢字工房</h1><span class="hud" id="hud"></span></header>
<main class="wrap">
<section class="screen on" id="title">
  <div class="card"><h2>部品を組み立てて、簡体字をつくろう</h2>
  <p>語の中の空欄に入る字を、部品から組み立てます。日本の漢字の部品（言・食・金…）も混ざっているので注意！</p></div>
  <div class="card"><h3 class="mt0">ステージ</h3>
  <div class="seg" id="stg"><button type="button" data-s="1" aria-pressed="true">① 左右</button><button type="button" data-s="2" aria-pressed="false">② 上下＋混合</button><button type="button" data-s="3" aria-pressed="false">③ 日本の字は？</button></div>
  <p class="small" id="sdesc"></p>
  <button class="btn" id="go" type="button">スタート</button>
  <p class="small" id="best"></p></div>
</section>

<section class="screen" id="play">
  <div class="bar"><i id="prog"></i></div>
  <div class="card center" id="prompt"></div>
  <div id="astat"></div>
  <div id="work"></div>
  <div id="fb"></div>

</section>

  <div class="card" id="learned"></div>
  <button class="btn" id="toReview" type="button">復習する</button>
  <button class="btn ghost" id="again" type="button">もう一度</button>

</section>
<section class="screen" id="review">
  <div class="card"><h2>復習：まちがえた字</h2><div id="rlist"></div></div>
  <button class="btn ghost" id="toTitle2" type="button">タイトルへ</button>
</section>
</main>
<footer class="note">音声：先生の声をもとに合成 ／ ⚠先生確認：部品の分け方・日本の字との対応は新しく作成</footer>
<script>
'use strict';
/* 共通部品（各ファイルに同じものを埋め込み。外部ライブラリなし） */
const G = (() => {
  const GAME = document.documentElement.dataset.game || 'x';
  const KEY = 'cngame.' + GAME; // 合成版の保存キー
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k === 'html') e.innerHTML = v;
      else if (k === 'style') e.style.cssText = v;
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);

    for (const c of kids.flat(9)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
    return e;
  }
  // append(…, null) で「null」と表示されないように（null / false は飛ばす）
  { const ap = Element.prototype.append; Element.prototype.append = function (...a) { return ap.apply(this, a.filter(x => x != null && x !== false)); }; }
  let rnd = Math.random;
  function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(a, r = rnd) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function pick(a, n, r = rnd) { return shuffle(a, r).slice(0, n); }
  // ---- 保存（localStorage のみ。使えない環境でも遊べる） ----
  let mem = {};
  function load() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : {}; } catch (e) { return mem; } }
  function save(o) { mem = o; try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { } }
  // ---- 画面切り替え ----
  function show(id) { $$('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }
  // ---- タイマー（重ねがけ防止：新しい回の前に必ず clearAll） ----
  const T = new Set();
  function after(ms, fn) { const id = setTimeout(() => { T.delete(id); fn(); }, ms); T.add(id); return id; }
  function every(ms, fn) { const id = setInterval(fn, ms); T.add(-id); return id; }
  function clearAll() { for (const id of T) { if (id < 0) clearInterval(-id); else clearTimeout(id); } T.clear(); }
  // ---- 音声（1つの Audio を使い回す。失敗は画面内に表示、alert は使わない） ----
  const au = new Audio(); au.preload = 'auto';
  let playSeq = 0;
  function play(url) {
    const seq = ++playSeq; const st = $('#astat');
    if (st) st.textContent = '';
    return new Promise(res => {
      if (!url) return res(false);
      try { au.pause(); } catch (e) { }
      au.onended = () => { if (seq === playSeq) res(true); };
      au.onerror = () => { if (seq === playSeq) { if (st) st.textContent = '音声を再生できませんでした。通信状況を確認して、もう一度押してください。'; fail(url); res(false); } };
      au.src = url;
      const p = au.play();
      if (p && p.catch) p.catch(err => { if (seq !== playSeq) return; if (err && err.name === 'AbortError') return; if (st) st.textContent = '音声を再生できませんでした（' + (err && err.name === 'NotAllowedError' ? 'もう一度ボタンを押してください' : '通信状況を確認してください') + '）。'; fail(url); res(false); });
    });
  }
  // 再生できなかったことを各ゲームに知らせる（時間制のゲームはタイマーを止めて、文字のヒントを出す）
  function fail(url) { try { window.dispatchEvent(new CustomEvent('audiofail', { detail: url })); } catch (e) { } }
  function stopAudio() { playSeq++; try { au.pause(); } catch (e) { } }
  function audioBtn(url, label = '▶ 聞く') { return h('button', { class: 'audio', type: 'button', 'aria-label': '音声を聞く', onclick: () => play(url) }, label); }
  // ---- 表示部品 ----
  const zh = (t, cls = '') => h('span', { class: 'zh ' + cls, lang: 'zh-CN' }, t);
  const py = t => h('span', { class: 'py', lang: 'zh-Latn-pinyin' }, t);
  const ja = t => h('span', { class: 'ja' }, t);
  // 中級・上級用：ピンインは最初は隠しておき、「ピンイン」ボタンで出せる（中国語には必ずピンインが付いている状態にする）
  const pyh = t => h('span', { class: 'py hid', lang: 'zh-Latn-pinyin' }, t);
  function pyBtn() { const b = h('button', { class: 'btn inline ghost pybtn', type: 'button', 'aria-pressed': String(document.body.classList.contains('showpy')) }, document.body.classList.contains('showpy') ? 'ピンインを隠す' : 'ピンインを表示'); b.onclick = () => { const on = document.body.classList.toggle('showpy'); $$('.pybtn').forEach(x => { x.textContent = on ? 'ピンインを隠す' : 'ピンインを表示'; x.setAttribute('aria-pressed', String(on)); }); }; return b; }
  const chk = () => h('span', { class: 'chk' }, '⚠先生確認');
  const kb = t => h('span', { class: 'kb' }, t);
  function plain(p) { return p.normalize('NFD').replace(/[\u0300-\u0304\u0306\u0307\u0309-\u036f]/g, '').normalize('NFC'); }
  let toastT = 0;
  function toast(m) { let t = $('.toast'); if (!t) { t = h('div', { class: 'toast', role: 'status' }); document.body.append(t); } t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }
  // ---- 連打対策：1問につき1回だけ受け付ける ----
  function guard() { let used = false; const born = performance.now(); return fn => (...a) => { if (used || performance.now() - born < 300) return; used = true; fn(...a); }; } // 表示直後0.3秒のタップは前の画面の連打とみなして無視
  function lock(box) { $$('button', box).forEach(b => b.disabled = true); }
  const today = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  // ---- 連打対策：前のタップの時点で見えていなかった要素への 0.35 秒以内のタップは無視（画面が変わった直後の指の2回目） ----
  let lastTap = -1e9, seenVis = new WeakMap();
  document.addEventListener('click', e => {
    if (!e.isTrusted) return;
    const SEL = 'button,a,[role=button],.opt,.part,.tile,.hole', now = performance.now(), el = e.target.closest(SEL);
    if (!el) return; // ボタン以外のタップは対象外（全要素を調べないので軽い）
    if (now - lastTap < 350 && seenVis.get(el) !== true) { e.stopPropagation(); e.preventDefault(); return; }
    lastTap = now; seenVis = new WeakMap(); for (const x of document.querySelectorAll(SEL)) seenVis.set(x, x.offsetParent !== null || x.getClientRects().length > 0);
  }, true);
  // 答えたあと、フィードバックや「次へ」が画面に入るようにスクロール（動きを減らす設定なら一瞬で）
  const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  function reveal(el, block = 'nearest') { if (!el) return; try { el.scrollIntoView({ block, behavior: reduce() ? 'auto' : 'smooth' }); } catch (e) { el.scrollIntoView(); } } // 同期で呼ぶ（rAF だと直後のタップに間に合わないことがある）
  // 下の説明欄の高さを CSS 変数 --fh に入れる（説明欄が2行になってもボタンが隠れない）
  function fh() { const f = document.querySelector('footer.note'); document.documentElement.style.setProperty('--fh', (f ? f.offsetHeight : 0) + 'px'); }

  // 部品の候補：正解2つ＋日本の字の部品（あれば）＋簡体字の偏（へん）を必ず2つ以上まぜる
  // （前端レビュー：簡体字の偏が正解のときだけ出ると「偏を見たら選ぶ」で当たってしまうため）
  const pool = new Set(q.p); if (q.trap) pool.add(q.trap);
  for (const f of G.shuffle(RAD.filter(r => !q.p.includes(r))).slice(0, 2)) pool.add(f);
  for (const f of G.shuffle(FILL)) { if (pool.size >= 6) break; pool.add(f); }
  const parts = G.h('div', { class: 'parts' });
  G.shuffle([...pool]).forEach(x => { const b = G.h('button', { class: 'part zh', type: 'button', lang: 'zh-CN', 'data-p': x }, x); b.onclick = () => pick(x, b); parts.append(b); });
  wk.append(parts, G.h('button', { class: 'btn stick', id: 'judge', type: 'button', disabled: true, onclick: () => judge(q) }, '組み立て確定'));
  if (G.test) window.__t = { answer: q.p };
}
function drawSlots() { G.$$('.slotb').forEach((s, i) => { s.textContent = picked[i] ? picked[i].x : ''; s.classList.toggle('fill', !!picked[i]); }); G.$$('.part').forEach(b => b.classList.toggle('used', picked.some(p => p && p.b === b))); const j = G.$('#judge'); if (j) j.disabled = done || picked.filter(Boolean).length < 2; }
function pick(x, b) { if (done || picked.some(p => p && p.b === b)) return; const i = picked[0] ? (picked[1] ? -1 : 1) : 0; if (i < 0) return; picked[i] = { x, b }; drawSlots(); }
function unpick(i) { if (done) return; picked[i] = null; drawSlots(); }
function judge(q) {
  if (done || picked.filter(Boolean).length < 2) return; done = true;
  G.lock(G.$('#work')); G.$('#judge').style.display = 'none';
  const ans = picked.map(p => p.x), ok = ans[0] === q.p[0] && ans[1] === q.p[1];
  log.push({ q, ok, ans });
  const fb = G.h('div', { class: 'fb ' + (ok ? 'ok' : 'ng') },
    G.h('b', {}, ok ? '正解！' : '不正解… 正しくは ' + q.p.join(' ＋ ')),
    G.h('div', { class: 'cmp' }, G.h('div', {}, G.h('div', { class: 'g zh', lang: 'zh-CN' }, q.c), G.h('small', {}, '簡体字')), G.h('div', {}, '⇔'),
      G.h('div', {}, G.h('div', { class: 'g', lang: 'ja' }, q.jp || '—'), G.h('small', {}, q.jp ? '日本の字' : '日本ではふつう使わない'))),
    G.h('p', {}, q.note, ' ', G.chk()));
  G.$('#fb').append(fb); showNext();
}
function judge3(q, x, box) {
  done = true; G.lock(box); const ok = x === q[1];
  const j3 = G.$('#ja3'); if (j3) { j3.className = ''; j3.innerHTML = ''; j3.append(G.ja(W[q[q.length - 1]].ja)); }
  G.$$('.opt', box).forEach(b => { if (b.dataset.c === q[1]) b.classList.add('ok'); else if (b.dataset.c === x) b.classList.add('ng'); });
  log.push({ q: { c: q[0], jp: q[1], w: q[5], note: x === '机' && q[0] === '机' ? '日本の「机」は「つくえ」。中国語の「机」は「機」。' : '' }, ok, ans: [x] });
  G.$('#fb').append(G.h('div', { class: 'fb ' + (ok ? 'ok' : 'ng') }, G.h('b', {}, ok ? '正解！' : '不正解'), ` 「${q[0]}」は日本の「${q[1]}」に当たります。`, q[0] === '机' ? '日本の「机」（つくえ）とは別の意味。' : '', ' ', G.chk()));
  showNext();
}
function showNext() { const nx = G.$('#next'); nx.textContent = qi + 1 < qs.length ? '次へ' : '結果を見る'; nx.style.display = 'block'; nx.disabled = false; G.reveal(G.$('#fb')); }
G.$('#next').onclick = () => { const nx = G.$('#next'); if (nx.disabled) return; nx.disabled = true; qi++; if (qi < qs.length) ask(); else finish(); };
function finish() {
  G.clearAll(); G.$('#hud').textContent = ''; const n = log.filter(l => l.ok).length;
  if (st.best[stg] == null || n > st.best[stg]) st.best[stg] = n; G.save(st);
  G.$('#score').innerHTML = ''; G.$('#score').append(G.h('p', { style: 'font-size:30px;font-weight:700;margin:0' }, `${n} / ${log.length}`), G.h('p', { class: 'small' }, `ステージ${stg} のベスト ${st.best[stg]} / 8`));
  const L = G.$('#learned'); L.innerHTML = ''; L.append(G.h('h3', { class: 'mt0' }, '今回の字（簡体字 ⇔ 日本の字）'));
  const tb = G.h('table', { class: 't' }); log.forEach(l => tb.append(G.h('tr', {}, G.h('td', {}, G.zh(l.q.c, 'mid')), G.h('td', { lang: 'ja', style: 'font-size:22px' }, l.q.jp || '—'), G.h('td', {}, l.ok ? '○' : '×')))); L.append(tb, G.h('p', { class: 'small' }, '⚠先生確認'));
  G.show('result');
}
function renderReview() {
  const box = G.$('#rlist'); box.innerHTML = ''; const miss = log.filter(l => !l.ok);
  if (!miss.length) box.append(G.h('p', {}, '全問正解です。'));
  miss.forEach(l => box.append(G.h('div', { class: 'card' }, G.zh(l.q.c, 'big'), ' ', l.q.p ? G.h('b', {}, l.q.p.join(' ＋ ')) : null, G.h('p', {}, '日本の字：' + (l.q.jp || '（ふつう使わない）') + ' ／ あなた：' + l.ans.join(' ＋ ')), l.q.note ? G.h('p', { class: 'small' }, l.q.note + ' ⚠先生確認') : null, G.audioBtn(W[l.q.w].audio))));
}
G.$('#go').onclick = start; G.$('#again').onclick = start;
G.$('#toReview').onclick = () => { renderReview(); G.show('review'); };
G.$('#toTitle').onclick = G.$('#toTitle2').onclick = () => { G.clearAll(); G.stopAudio(); setStg(stg); G.$('#hud').textContent = ''; G.show('title'); };
setStg(1);
</script>
