<!DOCTYPE html>
<!--
【13 時間順ならべ（高橋さんの一日）】 設計メモ（合成版：Grok Bot 版を土台に、各AI版の検証済みの長所を統合）
■学習目標：第11課読解の文を、時間を表す語（今天・上午9点10分・上课时・下午・晚上9点）と話の流れ
  （病院で診察→診断→休むように言われる）を手がかりに、出来事の順番に並べる。そのあと「なぜ？」に本文の語句で答える（因为…所以…）。
  日本の学生は語順・時間語の位置（時間語は動詞の前）に慣れていないので、時間語に注目させる。
■一局：初級 5 文・約 1 分／中級・上級 9 文＋「なぜ？」4 問・約 3〜4 分。
■画面：タイトル（レベル）→ ならべる（下のカードを順にタップすると上に並ぶ。上のカードをタップすると戻る。🔊で音声）
  → 判定（逆になっている所だけ「この2文の順番」を表示。何度でも直せる）→ 全部正しければ本文を通して聞く → 「なぜ？」4択 → 結果。
■素材：第11課読解 9 文の漢字・ピンイン・訳・音声をそのまま使う（原文の「所 以」「tāj iù」なども直さない）。
  「なぜ？」の質問文・ピンイン・訳は新しく作成（⚠先生確認）。答えの選択肢は本文から切り出した語句そのまま。
■正しい順番：h-2→h-3→h-4→h-5→h-6→h-7→h-9 は固定。h-1（病了）は h-3 より前ならよい。h-8（休むように言われる）は
  h-5 の後・h-9 の前ならよい（h-6・h-7 との前後は問わない）。⚠先生確認：この許容範囲でよいか。
■難度：初級＝時間語のある 5 文（h-2,3,4,5,9）・時間語に色・ピンインと訳あり　中級＝9 文・ピンインあり・訳は切替
  上級＝9 文・漢字だけ（音声は聞ける）。ヒントで順番そのものは見せない（判定後に逆の 2 文を示すだけ）。
■スマホ・iPhone：カードは全幅・高さ 56px 以上、🔊は 48px 角。ドラッグは使わない（タップだけ）。
■効果の確かめ方：判定の回数・時間・「なぜ？」の正答数をレベルごとに保存（ベスト）。
■リスク：本文の時間の流れの解釈（h-1 の位置、h-6〜h-8 の前後）。「なぜ？」の答えは本文に「因为」と書かれていない所もある。
■前端レビュー後：ピンイン・訳を16pxに。並べたカードは中国語だけの1行に縮め（ピンインは「ピンインを表示」で出せる）、ページを短くした。並べたカードに「↑」（1つ上へ）を追加。「判定する」（残りの枚数を表示）と「次へ」を画面下に固定。
■成品確認後：順番の判定は規則の推移閉包で行う（初級で h-9 をどこに置いても正解になっていたのを修正）。「なぜ？」の誤答は、その質問の理由として成り立たない本文の語句だけ（体調・病気の語句どうしを誤答にしない）。
-->

  const kb = t => h('span', { class: 'kb' }, t);
  function plain(p) { return p.normalize('NFD').replace(/[\u0300-\u0304\u0306\u0307\u0309-\u036f]/g, '').normalize('NFC'); }
